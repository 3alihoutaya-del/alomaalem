<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ملف الحرفي | ألو معلم</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f5f7fa;
    color: #222;
}

header {
    background: white;
    padding: 18px 6%;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #d62828;
}

.logo span {
    color: #16803c;
}

.container {
    max-width: 650px;
    margin: 40px auto;
    padding: 20px;
}

.profile {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
    text-align: center;
}

.photo {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 20px;
}

.avatar {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: #16803c;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    margin: 0 auto 20px;
}

h1 {
    margin: 10px 0;
}

.profession {
    color: #d62828;
    font-size: 20px;
    font-weight: bold;
}

.city {
    margin-top: 10px;
    color: #555;
}

.description {
    background: #f5f7fa;
    padding: 18px;
    border-radius: 12px;
    margin-top: 25px;
    line-height: 1.8;
    text-align: right;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.buttons a {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    text-decoration: none;
    color: white;
    font-weight: bold;
}

.call {
    background: #16803c;
}

.whatsapp {
    background: #25D366;
}

.back {
    display: block;
    margin-top: 25px;
    color: #d62828;
    text-decoration: none;
    font-weight: bold;
}

.message {
    text-align: center;
    background: white;
    padding: 30px;
    border-radius: 15px;
}

</style>

</head>

<body>

<header>

<div class="logo">
    ألو <span>معلم</span>
</div>

</header>


<div class="container">

<div id="profile">

<div class="message">
    ⏳ جاري تحميل ملف الحرفي...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
    "https://kjmvewppokrzcbegxmwg.supabase.co";

const SUPABASE_KEY =
    "ضع Publishable Key هنا";


const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


async function loadCraftsman() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const id =
        params.get("id");


    const container =
        document.getElementById(
            "profile"
        );


    if (!id) {

        container.innerHTML = `
            <div class="message">
                ❌ لم يتم تحديد الحرفي.
            </div>
        `;

        return;

    }


    const { data, error } =
        await client
            .from("craftsmen")
            .select(
                "id,name,profession,city,phone,description,photo_url,status"
            )
            .eq("id", id)
            .eq("status", "approved")
            .single();


    if (error || !data) {

        container.innerHTML = `
            <div class="message">
                ❌ هذا الحرفي غير موجود
                أو لم تتم الموافقة عليه.
            </div>

            <a
                class="back"
                href="index.html"
            >
                ← العودة للحرفيين
            </a>
        `;

        return;

    }


    const craft = data;


    const whatsappNumber =
        craft.phone.startsWith("0")
        ? "212" +
          craft.phone.substring(1)
        : craft.phone;


    const photo =
        craft.photo_url

        ? `
            <img
                class="photo"
                src="${escapeHtml(
                    craft.photo_url
                )}"
                alt="${escapeHtml(
                    craft.name
                )}"
            >
        `

        : `
            <div class="avatar">
                👷
            </div>
        `;


    container.innerHTML = `

        <div class="profile">

            ${photo}

            <h1>
                👷 ${escapeHtml(
                    craft.name
                )}
            </h1>

            <div class="profession">
                ${escapeHtml(
                    craft.profession
                )}
            </div>

            <div class="city">
                📍 ${escapeHtml(
                    craft.city
                )}
            </div>

            <div class="description">

                <strong>
                    🛠️ وصف الخدمات
                </strong>

                <br><br>

                ${escapeHtml(
                    craft.description ||
                    "لم يضف الحرفي وصفًا للخدمات."
                )}

            </div>


            <div class="buttons">

                <a
                    class="call"
                    href="tel:${escapeHtml(
                        craft.phone
                    )}"
                >
                    📞 اتصال
                </a>


                <a
                    class="whatsapp"
                    href="https://wa.me/${whatsappNumber}"
                    target="_blank"
                    rel="noopener"
                >
                    💬 WhatsApp
                </a>

            </div>


            <a
                class="back"
                href="index.html"
            >
                ← العودة إلى قائمة الحرفيين
            </a>

        </div>

    `;

}


loadCraftsman();

</script>

</body>

</html>
