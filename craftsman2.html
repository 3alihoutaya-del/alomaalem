<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ملف الحرفي | ألو معلم</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f5f7fa;
    color: #222;
}

header {
    background: white;
    padding: 18px 6%;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #d62828;
}

.logo span {
    color: #16803c;
}

.container {
    max-width: 850px;
    margin: 40px auto;
    padding: 20px;
}

.profile {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
    text-align: center;
}

.photo {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 20px;
}

.avatar {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: #16803c;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    margin: 0 auto 20px;
}

h1 {
    margin: 10px 0;
}

.profession {
    color: #d62828;
    font-size: 20px;
    font-weight: bold;
}

.city {
    margin-top: 10px;
    color: #555;
}

.description {
    background: #f5f7fa;
    padding: 18px;
    border-radius: 12px;
    margin-top: 25px;
    line-height: 1.8;
    text-align: right;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.buttons a {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    text-decoration: none;
    color: white;
    font-weight: bold;
}

.call {
    background: #16803c;
}

.whatsapp {
    background: #25D366;
}

.section {
    background: white;
    margin-top: 25px;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.section h2 {
    margin-bottom: 20px;
}

.gallery {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
}

.gallery img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 12px;
}

.no-photos {
    color: #777;
    text-align: center;
    padding: 20px;
}

.rating-summary {
    text-align: center;
    margin-bottom: 25px;
}

.stars {
    font-size: 30px;
    letter-spacing: 3px;
}

.rating-number {
    font-size: 22px;
    font-weight: bold;
    margin-top: 8px;
}

.review {
    border-top: 1px solid #eee;
    padding: 18px 0;
    text-align: right;
}

.review-stars {
    color: #f5a623;
    font-size: 20px;
}

.review-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.review-comment {
    color: #555;
    line-height: 1.7;
}

.review-form {
    margin-top: 25px;
    padding-top: 25px;
    border-top: 1px solid #eee;
}

.review-form input,
.review-form textarea,
.review-form select {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 16px;
    font-family: inherit;
}

.review-form textarea {
    min-height: 100px;
    resize: vertical;
}

.review-form button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #16803c;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.review-form button:hover {
    background: #116631;
}

.message {
    text-align: center;
    background: white;
    padding: 30px;
    border-radius: 15px;
}

.back {
    display: block;
    margin-top: 25px;
    color: #d62828;
    text-decoration: none;
    font-weight: bold;
    text-align: center;
}

@media (max-width: 600px) {

    .container {
        margin: 20px auto;
        padding: 15px;
    }

    .profile {
        padding: 22px 16px;
    }

    .buttons {
        flex-direction: column;
    }

    .gallery {
        grid-template-columns: 1fr 1fr;
    }

}

</style>

</head>


<body>


<header>

<div class="logo">
    ألو <span>معلم</span>
</div>

</header>



<div class="container">

<div id="profile">

<div class="message">
    ⏳ جاري تحميل ملف الحرفي...
</div>

</div>


<div id="gallerySection"></div>


<div id="reviewsSection"></div>


</div>



<script>


const SUPABASE_URL =
    "https://kjmvewppokrzcbegxmwg.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_As8JEhEsIfOta6cyi6e_AA_tp-T9k0W";


const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let craftsmanId = null;



function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}



function stars(number) {

    const rating =
        Math.round(Number(number) || 0);

    return "★".repeat(rating) +
           "☆".repeat(5 - rating);

}



async function loadCraftsman() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    craftsmanId =
        params.get("id");


    const container =
        document.getElementById(
            "profile"
        );


    if (!craftsmanId) {

        container.innerHTML = `
            <div class="message">
                ❌ لم يتم تحديد الحرفي.
            </div>
        `;

        return;

    }


    const { data, error } =
        await client
            .from("craftsmen")
            .select(
                "id,name,profession,city,phone,description,photo_url,status,address,latitude,longitude,availability"
            )
            .eq("id", craftsmanId)
            .eq("status", "approved")
            .single();


    if (error || !data) {

        container.innerHTML = `
            <div class="message">
                ❌ هذا الحرفي غير موجود
                أو لم تتم الموافقة عليه.
            </div>

            <a
                class="back"
                href="index.html"
            >
                ← العودة إلى الحرفيين
            </a>
        `;

        return;

    }


    const craft = data;


    const phone =
        String(craft.phone || "");


    const whatsappNumber =
        phone.startsWith("0")
        ? "212" + phone.substring(1)
        : phone;


    const photo =
        craft.photo_url

        ? `
            <img
                class="photo"
                src="${escapeHtml(
                    craft.photo_url
                )}"
                alt="${escapeHtml(
                    craft.name
                )}"
            >
        `

        : `
            <div class="avatar">
                👷
            </div>
        `;


    container.innerHTML = `

        <div class="profile">

            ${photo}

            <h1>
                👷 ${escapeHtml(
                    craft.name
                )}
            </h1>

            <div class="profession">
                ${escapeHtml(
                    craft.profession
                )}
            </div>

            <div class="city">
                📍 ${escapeHtml(
                    craft.city
                )}
            </div>

            ${
                craft.address
                ? `
                    <div class="city">
                        🏠 ${escapeHtml(
                            craft.address
                        )}
                    </div>
                  `
                : ""
            }

            ${
                craft.availability
                ? `
                    <div style="
                        margin-top:15px;
                        color:#16803c;
                        font-weight:bold;
                    ">
                        🟢 ${escapeHtml(
                            craft.availability
                        )}
                    </div>
                  `
                : ""
            }

            <div class="description">

                <strong>
                    🛠️ وصف الخدمات
                </strong>

                <br><br>

                ${escapeHtml(
                    craft.description ||
                    "لم يضف الحرفي وصفًا للخدمات."
                )}

            </div>


            <div class="buttons">

                <a
                    class="call"
                    href="tel:${escapeHtml(
                        phone
                    )}"
                >
                    📞 اتصال
                </a>


                <a
                    class="whatsapp"
                    href="https://wa.me/${whatsappNumber}"
                    target="_blank"
                    rel="noopener"
                >
                    💬 WhatsApp
                </a>

            </div>


            <a
                class="back"
                href="index.html"
            >
                ← العودة إلى قائمة الحرفيين
            </a>

        </div>

    `;


    await loadGallery();

    await loadReviews();

}



async function loadGallery() {

    const container =
        document.getElementById(
            "gallerySection"
        );


    const { data, error } =
        await client
            .from("craftsman_photos")
            .select(
                "id,photo_url,caption,created_at"
            )
            .eq(
                "craftsman_id",
                craftsmanId
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Gallery:",
            error
        );

        return;

    }


    if (!data || data.length === 0) {

        container.innerHTML = `

            <div class="section">

                <h2>
                    📷 معرض الأعمال
                </h2>

                <div class="no-photos">
                    لم تتم إضافة صور للأعمال بعد.
                </div>

            </div>

        `;

        return;

    }


    container.innerHTML = `

        <div class="section">

            <h2>
                📷 معرض الأعمال
            </h2>

            <div class="gallery">

                ${data.map(function(photo) {

                    return `

                        <div>

                            <img
                                src="${escapeHtml(
                                    photo.photo_url
                                )}"
                                alt="عمل الحرفي"
                            >

                            ${
                                photo.caption
                                ? `
                                    <p style="
                                        margin-top:6px;
                                        color:#666;
                                    ">
                                        ${escapeHtml(
                                            photo.caption
                                        )}
                                    </p>
                                  `
                                : ""
                            }

                        </div>

                    `;

                }).join("")}

            </div>

        </div>

    `;

}



async function loadReviews() {

    const container =
        document.getElementById(
            "reviewsSection"
        );


    const { data, error } =
        await client
            .from("craftsman_reviews")
            .select(
                "id,rating,reviewer_name,comment,created_at"
            )
            .eq(
                "craftsman_id",
                craftsmanId
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Reviews:",
            error
        );

        return;

    }


    const reviews =
        data || [];


    let average = 0;


    if (reviews.length > 0) {

        const total =
            reviews.reduce(
                function(sum, review) {

                    return sum +
                        Number(
                            review.rating
                        );

                },
                0
            );

        average =
            total / reviews.length;

    }


    container.innerHTML = `

        <div class="section">

            <h2>
                ⭐ تقييمات الزبائن
            </h2>


            <div class="rating-summary">

                <div class="stars">
                    ${stars(average)}
                </div>

                <div class="rating-number">
                    ${
                        reviews.length
                        ? average.toFixed(1)
                        : "لا توجد تقييمات بعد"
                    }
                </div>

                ${
                    reviews.length
                    ? `
                        <div>
                            ${reviews.length}
                            تقييم
                        </div>
                      `
                    : ""
                }

            </div>


            <div>

                ${
                    reviews.length
                    ? reviews.map(
                        function(review) {

                            return `

                                <div class="review">

                                    <div class="review-name">
                                        ${escapeHtml(
                                            review.reviewer_name ||
                                            "زبون"
                                        )}
                                    </div>

                                    <div class="review-stars">
                                        ${stars(
                                            review.rating
                                        )}
                                    </div>

                                    ${
                                        review.comment
                                        ? `
                                            <div class="review-comment">
                                                ${escapeHtml(
                                                    review.comment
                                                )}
                                            </div>
                                          `
                                        : ""
                                    }

                                </div>

                            `;

                        }
                    ).join("")
                    : `
                        <div class="no-photos">
                            كن أول من يقيّم هذا الحرفي ⭐
                        </div>
                    `
                }

            </div>


            <div class="review-form">

                <h3>
                    ✍️ أضف تقييمك
                </h3>


                <label>
                    اسمك
                </label>

                <input
                    type="text"
                    id="reviewerName"
                    placeholder="مثال: محمد"
                >


                <label>
                    التقييم
                </label>

                <select id="rating">

                    <option value="5">
                        ⭐⭐⭐⭐⭐ ممتاز
                    </option>

                    <option value="4">
                        ⭐⭐⭐⭐ جيد جدًا
                    </option>

                    <option value="3">
                        ⭐⭐⭐ جيد
                    </option>

                    <option value="2">
                        ⭐⭐ متوسط
                    </option>

                    <option value="1">
                        ⭐ ضعيف
                    </option>

                </select>


                <label>
                    تعليقك
                </label>

                <textarea
                    id="reviewComment"
                    placeholder="اكتب رأيك عن الخدمة..."
                ></textarea>


                <button
                    type="button"
                    onclick="submitReview()"
                >
                    ⭐ إرسال التقييم
                </button>


                <div
                    id="reviewMessage"
                    style="margin-top:15px;text-align:center;"
                ></div>

            </div>

        </div>

    `;

}



async function submitReview() {

    const name =
        document.getElementById(
            "reviewerName"
        ).value.trim();


    const rating =
        Number(
            document.getElementById(
                "rating"
            ).value
        );


    const comment =
        document.getElementById(
            "reviewComment"
        ).value.trim();


    const message =
        document.getElementById(
            "reviewMessage"
        );


    if (!name) {

        message.innerHTML =
            "⚠️ اكتب اسمك أولًا.";

        return;

    }


    message.innerHTML =
        "⏳ جاري إرسال التقييم...";


    const { error } =
        await client
            .from("craftsman_reviews")
            .insert([{

                craftsman_id:
                    craftsmanId,

                rating:
                    rating,

                reviewer_name:
                    name,

                comment:
                    comment

            }]);


    if (error) {

        console.error(
            "Review error:",
            error
        );


        message.innerHTML =
            "❌ تعذر إرسال التقييم.";

        return;

    }


    message.innerHTML =
        "✅ تم إرسال التقييم بنجاح.";


    document.getElementById(
        "reviewerName"
    ).value = "";


    document.getElementById(
        "reviewComment"
    ).value = "";


    await loadReviews();

}



loadCraftsman();

</script>


</body>

</html>
