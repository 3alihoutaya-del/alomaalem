<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة الإدارة | ألو معلم</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #4caf50;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        .login {
            max-width: 450px;
            margin: 60px auto;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-button {
            width: 100%;
            background: #16803c;
            color: white;
            font-size: 17px;
        }

        .logout {
            background: #d62828;
            color: white;
        }

        .approve {
            background: #16803c;
            color: white;
        }

        .reject {
            background: #d62828;
            color: white;
        }

        .refresh {
            background: #333;
            color: white;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
        }

        .error {
            background: #ffe5e5;
            color: #a00000;
        }

        .success {
            background: #e5ffe9;
            color: #087522;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-top: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: right;
        }

        th {
            background: #f1f3f5;
        }

        .status {
            font-weight: bold;
        }

        .pending {
            color: #c27a00;
        }

        .approved {
            color: #16803c;
        }

        .rejected {
            color: #d62828;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        #dashboard {
            display: none;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        ألو <span>معلم</span> — الإدارة
    </div>

    <button id="logoutButton" class="logout" style="display:none;">
        تسجيل الخروج
    </button>
</header>


<div id="loginScreen" class="container">

    <div class="box login">

        <h1>🔐 دخول الإدارة</h1>

        <p style="margin: 10px 0 20px; color:#666;">
            هذه الصفحة مخصصة لإدارة الحرفيين.
        </p>

        <label>البريد الإلكتروني</label>

        <input
            type="email"
            id="email"
            placeholder="البريد الإلكتروني"
            required
        >

        <label>كلمة المرور</label>

        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
            required
        >

        <button id="loginButton" class="login-button">
            دخول
        </button>

        <div id="loginMessage"></div>

    </div>

</div>


<div id="dashboard" class="container">

    <div class="box">

        <div style="display:flex; justify-content:space-between; align-items:center; gap:15px; flex-wrap:wrap;">

            <div>
                <h1>👷 إدارة الحرفيين</h1>

                <p style="color:#666; margin-top:5px;">
                    راجع طلبات التسجيل ثم وافق أو ارفض.
                </p>
            </div>

            <button id="refreshButton" class="refresh">
                🔄 تحديث
            </button>

        </div>

        <div id="dashboardMessage"></div>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>المهنة</th>
                        <th>المدينة</th>
                        <th>الهاتف</th>
                        <th>الوصف</th>
                        <th>الحالة</th>
                        <th>الإجراء</th>
                    </tr>
                </thead>

                <tbody id="craftsmenTable">
                </tbody>

            </table>

        </div>

    </div>

</div>


<script>
const SUPABASE_URL = "https://kjmvewppokrzcbegxmwg.supabase.co";
const SUPABASE_KEY = "sb_publishable_As8JEhEsIfOta6cyi6e_AA_tp-T9k0W";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const ADMIN_ID = "d4dcd2a0-158e-4bb6-9ca1-1949f16fdbd3";


const loginScreen = document.getElementById("loginScreen");
const dashboard = document.getElementById("dashboard");
const logoutButton = document.getElementById("logoutButton");

const loginButton = document.getElementById("loginButton");
const refreshButton = document.getElementById("refreshButton");

const loginMessage = document.getElementById("loginMessage");
const dashboardMessage = document.getElementById("dashboardMessage");

const craftsmenTable = document.getElementById("craftsmenTable");


loginButton.addEventListener("click", login);

logoutButton.addEventListener("click", async function () {

    await client.auth.signOut();

    dashboard.style.display = "none";
    loginScreen.style.display = "block";
    logoutButton.style.display = "none";

});


refreshButton.addEventListener("click", loadCraftsmen);


async function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    loginMessage.innerHTML = "";

    if (!email || !password) {

        loginMessage.innerHTML =
            "<div class='message error'>أدخل البريد الإلكتروني وكلمة المرور.</div>";

        return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "⏳ جاري الدخول...";

    const { data, error } =
        await client.auth.signInWithPassword({
            email: email,
            password: password
        });

    loginButton.disabled = false;
    loginButton.textContent = "دخول";


    if (error) {

        loginMessage.innerHTML =
            "<div class='message error'>" +
            "❌ " + error.message +
            "</div>";

        return;
    }


    if (!data.user || data.user.id !== ADMIN_ID) {

        await client.auth.signOut();

        loginMessage.innerHTML =
            "<div class='message error'>" +
            "❌ هذا الحساب ليس حساب المدير." +
            "</div>";

        return;
    }


    loginScreen.style.display = "none";
    dashboard.style.display = "block";
    logoutButton.style.display = "block";

    await loadCraftsmen();

}


async function loadCraftsmen() {

    dashboardMessage.innerHTML = "";

    craftsmenTable.innerHTML =
        "<tr><td colspan='7' style='text-align:center;'>⏳ جاري التحميل...</td></tr>";

    const { data, error } =
        await client
        .from("craftsmen")
        .select("*")
        .order("created_at", { ascending: false });


    if (error) {

        craftsmenTable.innerHTML = "";

        dashboardMessage.innerHTML =
            "<div class='message error'>" +
            "❌ " + error.message +
            "</div>";

        return;
    }


    if (!data || data.length === 0) {

        craftsmenTable.innerHTML =
            "<tr><td colspan='7' style='text-align:center;'>لا توجد طلبات.</td></tr>";

        return;
    }


    craftsmenTable.innerHTML = "";


    data.forEach(function(craft) {

        const row = document.createElement("tr");

        let statusClass = "pending";

        if (craft.status === "approved") {
            statusClass = "approved";
        }

        if (craft.status === "rejected") {
            statusClass = "rejected";
        }


        row.innerHTML = `

            <td>${escapeHtml(craft.name)}</td>

            <td>${escapeHtml(craft.profession)}</td>

            <td>${escapeHtml(craft.city)}</td>

            <td>${escapeHtml(craft.phone)}</td>

            <td>${escapeHtml(craft.description || "")}</td>

            <td class="status ${statusClass}">
                ${escapeHtml(craft.status)}
            </td>

            <td>

                <div class="actions">

                    ${
                        craft.status !== "approved"
                        ?
                        `<button
                            class="approve"
                            onclick="changeStatus(${craft.id}, 'approved')">
                            ✅ قبول
                        </button>`
                        :
                        ""
                    }

                    ${
                        craft.status !== "rejected"
                        ?
                        `<button
                            class="reject"
                            onclick="changeStatus(${craft.id}, 'rejected')">
                            ❌ رفض
                        </button>`
                        :
                        ""
                    }

                </div>

            </td>
        `;

        craftsmenTable.appendChild(row);

    });

}


async function changeStatus(id, newStatus) {

    const { error } =
        await client
        .from("craftsmen")
        .update({
            status: newStatus
        })
        .eq("id", id);


    if (error) {

        dashboardMessage.innerHTML =
            "<div class='message error'>" +
            "❌ " + error.message +
            "</div>";

        return;
    }


    dashboardMessage.innerHTML =
        "<div class='message success'>" +
        "✅ تم تحديث حالة الحرفي." +
        "</div>";

    await loadCraftsmen();

}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


async function checkSession() {

    const { data } =
        await client.auth.getUser();

    const user = data.user;

    if (!user || user.id !== ADMIN_ID) {

        loginScreen.style.display = "block";
        dashboard.style.display = "none";
        logoutButton.style.display = "none";

        return;
    }


    loginScreen.style.display = "none";
    dashboard.style.display = "block";
    logoutButton.style.display = "block";

    await loadCraftsmen();

}


checkSession();

</script>

</body>
</html>
