<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TactiGol News | لوحة الإدارة</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Tahoma, sans-serif;
    background: #f3f5f8;
    color: #111827;
}

.header {
    background: #0b1220;
    color: white;
    padding: 20px;
}

.header-inner {
    max-width: 1200px;
    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.logo {
    font-size: 27px;
    font-weight: bold;
}

.logo span {
    color: #00a86b;
}

.back {
    color: white;
    text-decoration: none;
    background: #00a86b;
    padding: 10px 15px;
    border-radius: 8px;
}

.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
}

.form-box,
.articles-box {
    background: white;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
}

h1 {
    margin-bottom: 8px;
}

h2 {
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.field.full {
    grid-column: 1 / -1;
}

label {
    font-weight: bold;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 16px;
    font-family: inherit;
}

textarea {
    min-height: 180px;
    resize: vertical;
}

button {
    border: none;
    cursor: pointer;
    font-family: inherit;
}

.save-btn {
    background: #00a86b;
    color: white;
    padding: 14px 22px;
    border-radius: 9px;
    font-size: 16px;
    font-weight: bold;
}

.clear-btn {
    background: #e5e7eb;
    color: #111827;
    padding: 14px 22px;
    border-radius: 9px;
    font-size: 16px;
    margin-right: 8px;
}

#message {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    display: none;
}

.success {
    display: block !important;
    background: #dcfce7;
    color: #166534;
}

.error {
    display: block !important;
    background: #fee2e2;
    color: #991b1b;
}

.articles-list {
    display: grid;
    gap: 15px;
}

.article-item {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 15px;

    display: grid;
    grid-template-columns: 130px 1fr auto;
    gap: 15px;
    align-items: center;
}

.article-item img {
    width: 130px;
    height: 90px;
    object-fit: cover;
    border-radius: 8px;
}

.article-info h3 {
    margin-bottom: 5px;
}

.meta {
    color: #6b7280;
    font-size: 13px;
}

.delete-btn {
    background: #dc2626;
    color: white;
    padding: 9px 13px;
    border-radius: 7px;
}

.edit-btn {
    background: #2563eb;
    color: white;
    padding: 9px 13px;
    border-radius: 7px;
    margin-bottom: 7px;
}

.actions {
    display: flex;
    flex-direction: column;
}

@media(max-width:700px) {

    .form-grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }

    .article-item {
        grid-template-columns: 1fr;
    }

    .article-item img {
        width: 100%;
        height: 180px;
    }

    .actions {
        flex-direction: row;
        gap: 8px;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="header-inner">

        <div class="logo">

            Tacti<span>Gol</span> News

        </div>

        <a
            href="index.html"
            class="back"
        >
            🏠 الموقع
        </a>

    </div>

</header>



<main class="container">


<section class="form-box">

    <h1>
        📝 إضافة خبر جديد
    </h1>

    <p style="color:#6b7280;margin-bottom:20px;">
        أضف الأخبار التي تريد نشرها على TactiGol News.
    </p>


    <form id="articleForm">


        <div class="form-grid">


            <div class="field full">

                <label>
                    عنوان الخبر
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="مثال: المنتخب المغربي يستعد للمباراة القادمة"
                    required
                >

            </div>


            <div class="field">

                <label>
                    القسم
                </label>

                <select
                    id="category"
                    required
                >

                    <option value="عام">
                        عام
                    </option>

                    <option value="المغرب">
                        🇲🇦 المغرب
                    </option>

                    <option value="عالمية">
                        🌍 عالمية
                    </option>

                    <option value="انتقالات">
                        🔥 انتقالات
                    </option>

                    <option value="تكتيك">
                        🎯 تحليل تكتيكي
                    </option>

                    <option value="دوري الأبطال">
                        🏆 دوري الأبطال
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    الكاتب
                </label>

                <input
                    type="text"
                    id="author"
                    value="TactiGol News"
                >

            </div>


            <div class="field full">

                <label>
                    ملخص الخبر
                </label>

                <textarea
                    id="excerpt"
                    style="min-height:100px"
                    placeholder="اكتب ملخصًا قصيرًا للخبر..."
                ></textarea>

            </div>


            <div class="field full">

                <label>
                    نص الخبر
                </label>

                <textarea
                    id="content"
                    placeholder="اكتب الخبر كاملًا هنا..."
                    required
                ></textarea>

            </div>


            <div class="field full">

                <label>
                    رابط الصورة
                </label>

                <input
                    type="url"
                    id="image_url"
                    placeholder="https://..."
                >

                <small style="color:#6b7280;">
                    ضع رابط صورة مباشر ينتهي غالبًا بـ .jpg أو .png أو .webp
                </small>

            </div>


            <div class="field">

                <label>
                    حالة الخبر
                </label>

                <select id="status">

                    <option value="published">
                        🟢 منشور
                    </option>

                    <option value="draft">
                        🟡 مسودة
                    </option>

                </select>

            </div>


        </div>


        <div style="margin-top:20px;">

            <button
                type="submit"
                class="save-btn"
            >
                📰 نشر الخبر
            </button>


            <button
                type="button"
                class="clear-btn"
                onclick="clearForm()"
            >
                مسح
            </button>

        </div>


        <div id="message"></div>


    </form>

</section>



<section class="articles-box">

    <h2>
        📰 الأخبار المنشورة
    </h2>

    <div
        id="articlesList"
        class="articles-list"
    >

        جاري تحميل الأخبار...

    </div>

</section>


</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
    "https://kjmvewppokrzcbegxmwg.supabase.co";


const SUPABASE_KEY =
    "hiden";


const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let editingId = null;



function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}



function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent = text;

    message.className = type;

}



function clearForm() {

    document.getElementById(
        "articleForm"
    ).reset();

    document.getElementById(
        "author"
    ).value = "TactiGol News";

    editingId = null;

    document.querySelector(
        ".save-btn"
    ).textContent =
        "📰 نشر الخبر";

}



async function loadArticles() {

    const list =
        document.getElementById(
            "articlesList"
        );


    const {
        data,
        error
    } = await client
        .from("articles")
        .select("*")
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        list.innerHTML =
            "❌ حدث خطأ أثناء تحميل الأخبار.";

        return;

    }


    if (!data || !data.length) {

        list.innerHTML =
            "لا توجد أخبار بعد.";

        return;

    }


    list.innerHTML =
        data.map(
            article => `

                <div class="article-item">

                    <img
                        src="${escapeHtml(
                            article.image_url ||
                            "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=500&q=80"
                        )}"
                        alt=""
                    >


                    <div class="article-info">

                        <h3>

                            ${escapeHtml(
                                article.title
                            )}

                        </h3>

                        <div class="meta">

                            ${escapeHtml(
                                article.category
                            )}

                            ·

                            ${escapeHtml(
                                article.status
                            )}

                        </div>

                    </div>


                    <div class="actions">

                        <button
                            class="edit-btn"
                            onclick="editArticle('${article.id}')"
                        >
                            ✏️ تعديل
                        </button>


                        <button
                            class="delete-btn"
                            onclick="deleteArticle('${article.id}')"
                        >
                            🗑️ حذف
                        </button>

                    </div>

                </div>

            `
        ).join("");

}



document.getElementById(
    "articleForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const title =
            document.getElementById(
                "title"
            ).value.trim();


        const excerpt =
            document.getElementById(
                "excerpt"
            ).value.trim();


        const content =
            document.getElementById(
                "content"
            ).value.trim();


        const category =
            document.getElementById(
                "category"
            ).value;


        const image_url =
            document.getElementById(
                "image_url"
            ).value.trim();


        const author =
            document.getElementById(
                "author"
            ).value.trim();


        const status =
            document.getElementById(
                "status"
            ).value;


        if (
            !title ||
            !content
        ) {

            showMessage(
                "⚠️ المرجو إدخال العنوان ونص الخبر.",
                "error"
            );

            return;

        }


        const article = {

            title,
            excerpt,
            content,
            category,
            image_url,
            author,
            status

        };


        showMessage(
            "⏳ جاري الحفظ...",
            "success"
        );


        let result;


        if (editingId) {

            result =
                await client
                    .from("articles")
                    .update(article)
                    .eq(
                        "id",
                        editingId
                    );

        } else {

            result =
                await client
                    .from("articles")
                    .insert([article]);

        }


        if (result.error) {

            console.error(
                result.error
            );

            showMessage(
                "❌ حدث خطأ: " +
                result.error.message,
                "error"
            );

            return;

        }


        showMessage(
            editingId
                ? "✅ تم تعديل الخبر بنجاح!"
                : "✅ تم نشر الخبر بنجاح!",
            "success"
        );


        clearForm();


        loadArticles();

    }
);



async function deleteArticle(id) {

    const confirmed =
        confirm(
            "هل أنت متأكد من حذف هذا الخبر؟"
        );


    if (!confirmed)
        return;


    const {
        error
    } = await client
        .from("articles")
        .delete()
        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            "❌ لم يتم حذف الخبر: " +
            error.message
        );

        return;

    }


    loadArticles();

}



async function editArticle(id) {

    const {
        data,
        error
    } = await client
        .from("articles")
        .select("*")
        .eq(
            "id",
            id
        )
        .single();


    if (error) {

        alert(
            "❌ لم يتم تحميل الخبر."
        );

        return;

    }


    editingId = id;


    document.getElementById(
        "title"
    ).value =
        data.title || "";


    document.getElementById(
        "excerpt"
    ).value =
        data.excerpt || "";


    document.getElementById(
        "content"
    ).value =
        data.content || "";


    document.getElementById(
        "category"
    ).value =
        data.category || "عام";


    document.getElementById(
        "image_url"
    ).value =
        data.image_url || "";


    document.getElementById(
        "author"
    ).value =
        data.author || "TactiGol News";


    document.getElementById(
        "status"
    ).value =
        data.status || "published";


    document.querySelector(
        ".save-btn"
    ).textContent =
        "💾 حفظ التعديل";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



loadArticles();

</script>


</body>

</html>
