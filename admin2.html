<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الإدارة | ألو معلم</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f5f7fa;
    color: #222;
}

header {
    background: white;
    padding: 20px 6%;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #d62828;
}

.logo span {
    color: #16803c;
}

.container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

.filters {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

.filters button {
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.pending-btn {
    background: #fff3cd;
}

.approved-btn {
    background: #d4edda;
}

.all-btn {
    background: #e2e3e5;
}

#craftsmen {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.photo {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 15px;
}

.avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #16803c;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
    margin: 0 auto 15px;
}

.name {
    text-align: center;
    font-size: 21px;
    font-weight: bold;
}

.profession {
    text-align: center;
    color: #d62828;
    margin-top: 5px;
    font-weight: bold;
}

.info {
    margin-top: 15px;
    line-height: 1.8;
}

.status {
    text-align: center;
    padding: 7px;
    border-radius: 8px;
    margin-top: 15px;
    font-weight: bold;
}

.status.pending {
    background: #fff3cd;
    color: #856404;
}

.status.approved {
    background: #d4edda;
    color: #155724;
}

.buttons {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.buttons button {
    flex: 1;
    border: none;
    padding: 11px;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.approve {
    background: #16803c;
}

.reject {
    background: #d62828;
}

.delete {
    background: #555;
}

.message {
    text-align: center;
    background: white;
    padding: 30px;
    border-radius: 12px;
}

</style>

</head>

<body>

<header>

<div class="logo">
    ألو <span>معلم</span>
</div>

</header>


<div class="container">

<h1>⚙️ لوحة إدارة الحرفيين</h1>


<div class="filters">

<button
    class="pending-btn"
    onclick="loadCraftsmen('pending')"
>
    🟡 قيد المراجعة
</button>

<button
    class="approved-btn"
    onclick="loadCraftsmen('approved')"
>
    🟢 المقبولون
</button>

<button
    class="all-btn"
    onclick="loadCraftsmen('all')"
>
    📋 الكل
</button>

</div>


<div id="craftsmen">

<div class="message">
    ⏳ جاري تحميل الحرفيين...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
    "https://kjmvewppokrzcbegxmwg.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_As8JEhEsIfOta6cyi6e_AA_tp-T9k0W";


const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


async function loadCraftsmen(statusFilter = "pending") {

    const container =
        document.getElementById("craftsmen");


    container.innerHTML = `
        <div class="message">
            ⏳ جاري التحميل...
        </div>
    `;


    let query =
        client
            .from("craftsmen")
            .select(
                "id,name,profession,city,phone,description,status,photo_url,created_at"
            )
            .order(
                "created_at",
                { ascending: false }
            );


    if (statusFilter !== "all") {

        query =
            query.eq(
                "status",
                statusFilter
            );

    }


    const { data, error } =
        await query;


    if (error) {

        console.error(error);

        container.innerHTML = `
            <div class="message">
                ❌ فشل تحميل الحرفيين
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

        return;

    }


    if (!data || data.length === 0) {

        container.innerHTML = `
            <div class="message">
                لا يوجد حرفيون في هذه القائمة.
            </div>
        `;

        return;

    }


    container.innerHTML = "";


    data.forEach(craft => {


        const card =
            document.createElement("div");

        card.className = "card";


        const photo =
            craft.photo_url
            ? `
                <img
                    class="photo"
                    src="${escapeHtml(craft.photo_url)}"
                    alt="${escapeHtml(craft.name)}"
                >
            `
            : `
                <div class="avatar">
                    👷
                </div>
            `;


        let buttons = "";


        if (craft.status === "pending") {

            buttons = `

                <button
                    class="approve"
                    onclick="updateStatus('${craft.id}','approved')"
                >
                    🟢 موافقة
                </button>

                <button
                    class="reject"
                    onclick="updateStatus('${craft.id}','rejected')"
                >
                    🔴 رفض
                </button>

            `;

        }


        if (craft.status === "approved") {

            buttons = `

                <button
                    class="reject"
                    onclick="updateStatus('${craft.id}','rejected')"
                >
                    🔴 إلغاء الموافقة
                </button>

            `;

        }


        buttons += `

            <button
                class="delete"
                onclick="deleteCraftsman('${craft.id}')"
            >
                🗑️ حذف
            </button>

        `;


        card.innerHTML = `

            ${photo}

            <div class="name">
                ${escapeHtml(craft.name)}
            </div>

            <div class="profession">
                ${escapeHtml(craft.profession)}
            </div>

            <div class="info">

                📍 ${escapeHtml(craft.city)}

                <br>

                📞 ${escapeHtml(craft.phone)}

                <br><br>

                ${escapeHtml(
                    craft.description || ""
                )}

            </div>

            <div class="status ${escapeHtml(craft.status)}">

                الحالة:
                ${escapeHtml(craft.status)}

            </div>

            <div class="buttons">

                ${buttons}

            </div>

        `;


        container.appendChild(card);

    });

}


async function updateStatus(id, newStatus) {

    const confirmed =
        confirm(
            newStatus === "approved"
            ? "هل تريد الموافقة على هذا الحرفي؟"
            : "هل تريد رفض هذا الحرفي؟"
        );


    if (!confirmed) {
        return;
    }


    const { error } =
        await client
            .from("craftsmen")
            .update({
                status: newStatus
            })
            .eq("id", id);


    if (error) {

        alert(
            "❌ فشل تغيير الحالة:\n\n" +
            error.message
        );

        return;

    }


    alert(
        newStatus === "approved"
        ? "✅ تمت الموافقة على الحرفي."
        : "🔴 تم رفض الحرفي."
    );


    loadCraftsmen("pending");

}


async function deleteCraftsman(id) {

    const confirmed =
        confirm(
            "⚠️ هل أنت متأكد من حذف هذا الحرفي؟"
        );


    if (!confirmed) {
        return;
    }


    const { error } =
        await client
            .from("craftsmen")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "❌ فشل الحذف:\n\n" +
            error.message
        );

        return;

    }


    alert("✅ تم حذف الحرفي.");


    loadCraftsmen("pending");

}


loadCraftsmen("pending");

</script>

</body>

</html>
