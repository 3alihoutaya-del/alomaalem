<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة ألو معلم</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f5f7fa;
    color: #222;
}

header {
    background: white;
    padding: 18px 6%;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #d62828;
}

.logo span {
    color: #16803c;
}

.container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 20px;
}

.login-box {
    max-width: 450px;
    margin: 70px auto;
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.login-box h1 {
    text-align: center;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 16px;
}

label {
    display: block;
    margin-top: 18px;
    font-weight: bold;
}

button {
    border: none;
    border-radius: 9px;
    padding: 12px 18px;
    cursor: pointer;
    font-weight: bold;
}

.login-button {
    width: 100%;
    margin-top: 25px;
    background: #16803c;
    color: white;
    font-size: 17px;
}

.logout {
    background: #d62828;
    color: white;
}

.admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.filters button {
    background: #e9ecef;
}

#craftsmen {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.photo,
.avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    display: block;
    margin: 0 auto 15px;
}

.photo {
    object-fit: cover;
}

.avatar {
    background: #16803c;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
}

.name {
    text-align: center;
    font-size: 21px;
    font-weight: bold;
}

.profession {
    text-align: center;
    color: #d62828;
    font-weight: bold;
    margin-top: 5px;
}

.info {
    line-height: 1.8;
    margin-top: 15px;
}

.status {
    text-align: center;
    padding: 8px;
    margin-top: 15px;
    border-radius: 8px;
    font-weight: bold;
}

.pending {
    background: #fff3cd;
    color: #856404;
}

.approved {
    background: #d4edda;
    color: #155724;
}

.rejected {
    background: #f8d7da;
    color: #721c24;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.actions button {
    flex: 1;
    color: white;
}

.approve {
    background: #16803c;
}

.reject {
    background: #d62828;
}

.delete {
    background: #555;
}

.message {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
}

.error {
    color: #b00020;
    background: #ffe5e5;
    padding: 12px;
    border-radius: 8px;
    margin-top: 15px;
}

.hidden {
    display: none;
}

</style>

</head>

<body>

<header>

<div class="logo">
    ألو <span>معلم</span>
</div>

</header>


<!-- LOGIN -->

<div id="loginSection">

<div class="login-box">

<h1>🔐 دخول الإدارة</h1>

<label for="email">
    البريد الإلكتروني
</label>

<input
    type="email"
    id="email"
    placeholder="البريد الإلكتروني"
>


<label for="password">
    كلمة المرور
</label>

<input
    type="password"
    id="password"
    placeholder="كلمة المرور"
>


<button
    class="login-button"
    id="loginButton"
>
    🔐 تسجيل الدخول
</button>

<div
    id="loginError"
    class="error hidden"
></div>

</div>

</div>


<!-- ADMIN -->

<div
    id="adminSection"
    class="container hidden"
>

<div class="admin-header">

<h1>
    ⚙️ لوحة إدارة الحرفيين
</h1>

<button
    class="logout"
    id="logoutButton"
>
    تسجيل الخروج
</button>

</div>


<div class="filters">

<button onclick="loadCraftsmen('pending')">
    🟡 قيد المراجعة
</button>

<button onclick="loadCraftsmen('approved')">
    🟢 المقبولون
</button>

<button onclick="loadCraftsmen('rejected')">
    🔴 المرفوضون
</button>

<button onclick="loadCraftsmen('all')">
    📋 الكل
</button>

</div>


<div id="craftsmen">

<div class="message">
    ⏳ جاري التحميل...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
    "https://kjmvewppokrzcbegxmwg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_As8JEhEsIfOta6cyi6e_AA_tp-T9k0W";


const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const loginSection =
    document.getElementById(
        "loginSection"
    );

const adminSection =
    document.getElementById(
        "adminSection"
    );


const loginError =
    document.getElementById(
        "loginError"
    );


/* =========================
   تسجيل الدخول
========================= */

document
    .getElementById("loginButton")
    .addEventListener(
        "click",
        async function() {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            loginError.classList.add(
                "hidden"
            );


            if (!email || !password) {

                loginError.textContent =
                    "أدخل البريد الإلكتروني وكلمة المرور.";

                loginError.classList.remove(
                    "hidden"
                );

                return;
            }


            const { error } =
                await client.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                loginError.textContent =
                    error.message;

                loginError.classList.remove(
                    "hidden"
                );

                return;
            }


            showAdmin();

        }
    );


/* =========================
   تسجيل الخروج
========================= */

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        async function() {

            await client.auth.signOut();

            showLogin();

        }
    );


/* =========================
   إظهار لوحة الإدارة
========================= */

function showAdmin() {

    loginSection.classList.add(
        "hidden"
    );

    adminSection.classList.remove(
        "hidden"
    );

    loadCraftsmen("pending");

}


/* =========================
   إظهار تسجيل الدخول
========================= */

function showLogin() {

    adminSection.classList.add(
        "hidden"
    );

    loginSection.classList.remove(
        "hidden"
    );

}


/* =========================
   التحقق من الجلسة
========================= */

async function checkSession() {

    const { data } =
        await client.auth.getSession();


    if (data.session) {

        showAdmin();

    } else {

        showLogin();

    }

}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================
   تحميل الحرفيين
========================= */

async function loadCraftsmen(
    statusFilter
) {

    const container =
        document.getElementById(
            "craftsmen"
        );


    container.innerHTML = `
        <div class="message">
            ⏳ جاري التحميل...
        </div>
    `;


    let query =
        client
            .from("craftsmen")
            .select(
                "id,name,profession,city,phone,description,status,photo_url,created_at"
            )
            .order(
                "created_at",
                { ascending: false }
            );


    if (statusFilter !== "all") {

        query =
            query.eq(
                "status",
                statusFilter
            );

    }


    const { data, error } =
        await query;


    if (error) {

        container.innerHTML = `
            <div class="message error">
                ❌ فشل تحميل الحرفيين
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

        return;

    }


    if (!data || data.length === 0) {

        container.innerHTML = `
            <div class="message">
                لا يوجد حرفيون في هذه القائمة.
            </div>
        `;

        return;

    }


    container.innerHTML = "";


    data.forEach(
        function(craft) {

            const card =
                document.createElement(
                    "div"
                );

            card.className = "card";


            const photo =
                craft.photo_url

                ? `
                    <img
                        class="photo"
                        src="${escapeHtml(craft.photo_url)}"
                        alt="${escapeHtml(craft.name)}"
                    >
                `

                : `
                    <div class="avatar">
                        👷
                    </div>
                `;


            let actions = "";


            if (
                craft.status ===
                "pending"
            ) {

                actions = `

                    <button
                        class="approve"
                        onclick="updateStatus(
                            '${craft.id}',
                            'approved'
                        )"
                    >
                        🟢 موافقة
                    </button>

                    <button
                        class="reject"
                        onclick="updateStatus(
                            '${craft.id}',
                            'rejected'
                        )"
                    >
                        🔴 رفض
                    </button>

                `;

            }


            if (
                craft.status ===
                "approved"
            ) {

                actions = `

                    <button
                        class="reject"
                        onclick="updateStatus(
                            '${craft.id}',
                            'rejected'
                        )"
                    >
                        🔴 إلغاء الموافقة
                    </button>

                `;

            }


            actions += `

                <button
                    class="delete"
                    onclick="deleteCraftsman(
                        '${craft.id}'
                    )"
                >
                    🗑️ حذف
                </button>

            `;


            card.innerHTML = `

                ${photo}

                <div class="name">
                    ${escapeHtml(craft.name)}
                </div>

                <div class="profession">
                    ${escapeHtml(craft.profession)}
                </div>

                <div class="info">

                    📍 ${escapeHtml(craft.city)}

                    <br>

                    📞 ${escapeHtml(craft.phone)}

                    <br><br>

                    ${escapeHtml(
                        craft.description || ""
                    )}

                </div>

                <div
                    class="status ${escapeHtml(
                        craft.status
                    )}"
                >
                    الحالة:
                    ${escapeHtml(
                        craft.status
                    )}
                </div>

                <div class="actions">
                    ${actions}
                </div>

            `;


            container.appendChild(card);

        }
    );

}


/* =========================
   تغيير الحالة
========================= */

async function updateStatus(
    id,
    newStatus
) {

    if (
        !confirm(
            newStatus === "approved"
            ? "هل تريد الموافقة على هذا الحرفي؟"
            : "هل تريد رفض هذا الحرفي؟"
        )
    ) {

        return;

    }


    const { error } =
        await client
            .from("craftsmen")
            .update({
                status: newStatus
            })
            .eq("id", id);


    if (error) {

        alert(
            "❌ فشل تغيير الحالة:\n\n" +
            error.message
        );

        return;

    }


    alert(
        newStatus === "approved"
        ? "✅ تمت الموافقة."
        : "🔴 تم الرفض."
    );


    loadCraftsmen("pending");

}


/* =========================
   حذف
========================= */

async function deleteCraftsman(id) {

    if (
        !confirm(
            "⚠️ هل أنت متأكد من حذف هذا الحرفي؟"
        )
    ) {

        return;

    }


    const { error } =
        await client
            .from("craftsmen")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "❌ فشل الحذف:\n\n" +
            error.message
        );

        return;

    }


    alert("✅ تم الحذف.");

    loadCraftsmen("pending");

}


/* بدء الصفحة */

checkSession();

</script>

</body>

</html>
