<style>

/* =====================================================
   VARIABLES
===================================================== */

:root {

    --primary: #00a86b;
    --primary-dark: #078153;

    --bg: #f4f6f8;
    --card: #ffffff;

    --text: #111827;

/* =====================================================
   DARK MODE
===================================================== */

body.dark {

    --bg: #07111f;
    --card: #0f1b2b;

    --text: #f3f4f6;
    --muted: #aab4c0;

    --border: #263548;

    --shadow:

/* =====================================================
   RESET
===================================================== */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}


html {

    scroll-behavior: smooth;

}


body {

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    background:
        var(--bg);

    color:
        var(--text);

    line-height:

a {

    text-decoration: none;

button {

}


/* =====================================================
   HEADER
===================================================== */

.header {

}


.header-inner {

}


/* =====================================================
   LOGO
===================================================== */

.logo {

    min-width:

    line-height:

}


.logo span {

}


.logo small {

    display:

    font-size:
        8px;

    letter-spacing:

}


/* =====================================================
   NAV
===================================================== */

.nav {

    display:
        flex;

    align-items:
        center;

    gap:
        4px;

    flex:

    overflow-x:

}


.nav::-webkit-scrollbar {

    display:

}


.nav a {

    padding:

        7px;

.nav a:hover,

}


/* =====================================================
   ACTIONS
===================================================== */

.actions {

        flex;

    gap:

}


.visitor-time {

        flex;

        8px;

        13px;

        ltr;

}


.visitor-time span {

    text-align:

}


.icon-btn {

        40px;

        40px;

        1px solid #294056;

    border-radius:
        8px;

        #102337;

    color:
        white;

    cursor:
        pointer;

    font-size:
        17px;

}


.icon-btn:hover {

    background:
        #18334d;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    max-width:
        1200px;

    margin:
        auto;

    padding:
        28px 18px 60px;

}


/* =====================================================
   PAGE TITLE
===================================================== */

.page-title {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        15px;

    margin-bottom:
        20px;

}


.page-title h1 {

    font-size:
        27px;

    font-weight:
        900;

}


.page-title p {

    color:
        var(--muted);

    font-size:
        13px;

}


/* =====================================================
   FILTERS
===================================================== */

.filters {

    display:
        flex;

    align-items:
        center;

    gap:
        8px;

    margin-bottom:
        20px;

    overflow-x:
        auto;

}


.filters::-webkit-scrollbar {

    display:
        none;

}


.filter-btn {

    border:
        1px solid var(--border);

    background:
        var(--card);

    color:
        var(--text);

    border-radius:
        8px;

    padding:
        8px 14px;

    cursor:
        pointer;

    white-space:
        nowrap;

    font-size:
        13px;

}


.filter-btn:hover,
.filter-btn.active {

    background:
        var(--primary);

    color:
        white;

    border-color:
        var(--primary);

}


/* =====================================================
   MATCHES GRID
===================================================== */

.matches-grid {

    display:
        grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap:
        14px;

}


/* =====================================================
   MATCH CARD
===================================================== */

.match-card {

    background:
        var(--card);

    border:
        1px solid var(--border);

    border-radius:
        14px;

    padding:
        16px;

    box-shadow:
        var(--shadow);

    transition:
        transform .2s,
        box-shadow .2s;

}


.match-card:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 14px 30px rgba(0,0,0,.11);

}


/* =====================================================
   MATCH TOP
===================================================== */

.match-top {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;

    margin-bottom:
        16px;

}


.competition {

    color:
        var(--primary);

    font-weight:
        bold;

    font-size:
        12px;

}


.status {

    font-size:
        11px;

    padding:
        3px 9px;

    border-radius:
        20px;

}


.status.live {

    background:
        #fee2e2;

    color:
        #dc2626;

}


.status.finished {

    background:
        #e2e8f0;

    color:
        #475569;

}


.status.scheduled {

    background:
        #dcfce7;

    color:
        #15803d;

}


.status.postponed {

    background:
        #fef3c7;

    color:
        #b45309;

}


body.dark .status {

    background:
        #1e293b;

    color:
        #cbd5e1;

}


body.dark .status.live {

    background:
        #451a1a;

    color:
        #fca5a5;

}


body.dark .status.scheduled {

    background:
        #12372b;

    color:
        #86efac;

}


/* =====================================================
   TEAMS
===================================================== */

.match-teams {

    display:
        grid;

    grid-template-columns:
        1fr 90px 1fr;

    align-items:
        center;

    gap:
        8px;

}


.team {

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    text-align:
        center;

    gap:
        7px;

}


.team-logo {

    width:
        58px;

    height:
        58px;

    object-fit:
        contain;

}


.team-placeholder {

    width:
        58px;

    height:
        58px;

    border-radius:
        50%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        var(--bg);

    border:
        1px solid var(--border);

    font-size:
        27px;

}


.team-name {

    font-size:
        14px;

    font-weight:
        800;

}


.team-short {

    color:
        var(--muted);

    font-size:
        10px;

}


/* =====================================================
   SCORE
===================================================== */

.match-score {

    text-align:
        center;

}


.score {

    font-size:
        26px;

    font-weight:
        900;

    line-height:
        1.1;

}


.vs {

    color:
        var(--muted);

    font-size:
        15px;

    font-weight:
        bold;

}


/* =====================================================
   DATE
===================================================== */

.match-date {

    text-align:
        center;

    margin-top:
        15px;

    padding-top:
        11px;

    border-top:
        1px solid var(--border);

    color:
        var(--muted);

    font-size:
        11px;

}


/* =====================================================
   DETAILS BUTTON
===================================================== */

.details-button {

    display:

    text-align:

    margin-top:
        12px;

    padding:
        8px;

        8px;

    background:
        rgba(0,168,107,.08);

    color:
        var(--primary);

    font-size:
        12px;

    font-weight:
        bold;

}


.details-button:hover {

    background:
        var(--primary);

    color:
        white;

}


/* =====================================================
   LOADING
===================================================== */

.loading {

    grid-column:
        1 / -1;

    background:
        var(--card);

    border:
        1px solid var(--border);

    border-radius:

    padding:
        60px 20px;

    color:

        var(--shadow);

/* =====================================================

.empty {

        1 / -1;

    border:

    border-radius:
        14px;

    padding:
        60px 20px;

    text-align:
        center;

}


.empty-icon {

    font-size:
        45px;

    margin-bottom:
        10px;

}


/* =====================================================
   ERROR
===================================================== */

.error {

    grid-column:
        1 / -1;

    background:
        var(--card);

    border:
        1px solid #fecaca;

    border-radius:
        14px;

    padding:
        40px 20px;

    text-align:
        center;

    color:

}


/* =====================================================
   FOOTER

.footer {

    background:

}


.footer-inner {

}

/* =====================================================

@media(max-width:750px) {

@media(max-width:500px) {

    }

    }

}

</style>

<!-- =====================================================

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://kjmvewppokrzcbegxmwg.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_As8JEhEsIfOta6cyi6e_AA_tp-T9k0W";


const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   VARIABLES
===================================================== */

let matches = [];

let currentFilter = "all";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date) {

    if (!date)
        return "غير محدد";


    const d =
        new Date(date);


    if (
        Number.isNaN(
            d.getTime()
        )
    )
        return "غير محدد";


    return d.toLocaleDateString(
        "ar-MA",
        {
            weekday:
                "long",

            year:
                "numeric",

            month:
                "long",

            day:
                "numeric"
        }
    );

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(date) {

    if (!date)
        return "--:--";


    const d =
        new Date(date);


    if (
        Number.isNaN(
            d.getTime()
        )
    )
        return "--:--";


    return d.toLocaleTimeString(
        [],
        {
            hour:
                "2-digit",

            minute:
                "2-digit",

            hour12:
                false
        }
    );

}


/* =====================================================
   STATUS
===================================================== */

function statusInfo(status) {

    switch(status) {

        case "live":

            return {
                text:
                    "🔴 مباشر",

                className:
                    "live"
            };


        case "finished":

            return {
                text:
                    "انتهت",

                className:
                    "finished"
            };


        case "postponed":

            return {
                text:
                    "مؤجلة",

                className:
                    "postponed"
            };


        default:

            return {
                text:
                    "مجدولة",

                className:
                    "scheduled"
            };

    }

}


/* =====================================================
   TEAM LOGO
===================================================== */

function renderTeamLogo(
    logo,
    name
) {

    if (logo) {

        return `

            <img
                class="team-logo"
                src="${escapeHtml(logo)}"
                alt="${escapeHtml(name)}"
                loading="lazy"
            >

        `;

    }


    return `

        <div
            class="team-placeholder"
            title="${escapeHtml(name)}"
        >
            ⚽
        </div>

    `;

}


/* =====================================================
   SCORE
===================================================== */

function renderScore(match) {

    if (
        match.home_score !== null &&
        match.home_score !== undefined &&
        match.away_score !== null &&
        match.away_score !== undefined
    ) {

        return `

            <div class="score">

                ${escapeHtml(
                    match.home_score
                )}

                -

                ${escapeHtml(
                    match.away_score
                )}

            </div>

        `;

    }


    return `

        <div class="vs">
            VS
        </div>

    `;

}


/* =====================================================
   RENDER CARD
===================================================== */

function matchCard(match) {

    const home =
        match.home || {};


    const away =
        match.away || {};


    const homeName =
        home.name ||
        match.home_team ||
        "الفريق المضيف";


    const awayName =
        away.name ||
        match.away_team ||
        "الفريق الضيف";


    const status =
        statusInfo(
            match.status
        );


    return `

<article
    class="match-card"
    data-status="${escapeHtml(
        match.status || "scheduled"
    )}"
>


<div class="match-top">


<span class="competition">

    🏆

    ${escapeHtml(
        match.competition ||
        "مباراة"
    )}

</span>


<span
    class="
        status
        ${status.className}
    "
>

    ${status.text}

</span>


</div>



<div class="match-teams">


<div class="team">


    ${renderTeamLogo(
        home.logo,
        homeName
    )}


    <div class="team-name">

        ${escapeHtml(
            homeName
        )}

    </div>


    <div class="team-short">

        ${escapeHtml(
            home.short_name ||
            ""
        )}

    </div>


</div>



<div class="match-score">

    ${renderScore(match)}

</div>



<div class="team">


    ${renderTeamLogo(
        away.logo,
        awayName
    )}


    <div class="team-name">

        ${escapeHtml(
            awayName
        )}

    </div>


    <div class="team-short">

        ${escapeHtml(
            away.short_name ||
            ""
        )}

    </div>


</div>


</div>



<div class="match-date">

    📅

    ${formatDate(
        match.match_date
    )}

    <br>

    🕐

    ${formatTime(
        match.match_date
    )}

</div>



<a
    href="match.html?id=${encodeURIComponent(
        match.id
    )}"
    class="details-button"
>

    عرض تفاصيل المباراة ←

</a>


</article>

`;

}


/* =====================================================
   RENDER MATCHES
===================================================== */

function renderMatches() {

    const grid =
        document.getElementById(
            "matchesGrid"
        );


    const filtered =
        currentFilter === "all"

        ? matches

        : matches.filter(
            function(match) {

                return (
                    match.status ===
                    currentFilter
                );

            }
        );


    if (!filtered.length) {

        grid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚽
                </div>

                <h2>
                    لا توجد مباريات
                </h2>

                <p>
                    لا توجد مباريات ضمن هذا التصنيف حاليًا.
                </p>

            </div>

        `;

        return;

    }


    grid.innerHTML =
        filtered
        .map(matchCard)
        .join("");

}


/* =====================================================
   LOAD MATCHES
===================================================== */

async function loadMatches() {

    const grid =
        document.getElementById(
            "matchesGrid"
        );


    grid.innerHTML = `

        <div class="loading">

            ⏳ جاري تحميل المباريات...

        </div>

    `;


    try {

        const {
            data,
            error
        } = await client

            .from("matches")

            .select(`

                *,

                home:teams!matches_home_team_id_fkey (
                    id,
                    name,
                    short_name,
                    logo
                ),

                away:teams!matches_away_team_id_fkey (
                    id,
                    name,
                    short_name,
                    logo
                )

            `)

            .order(
                "match_date",
                {
                    ascending: true
                }
            );


        if (error) {

            console.error(
                "Supabase error:",
                error
            );


            grid.innerHTML = `

                <div class="error">

                    ❌ تعذر تحميل المباريات.

                    <br><br>

                    تأكد من إعدادات Supabase.

                </div>

            `;

            return;

        }


        matches =
            data || [];


        renderMatches();

    }
    catch(error) {

        console.error(
            error
        );


        grid.innerHTML = `

            <div class="error">

                ❌ حدث خطأ أثناء تحميل المباريات.

            </div>

        `;

    }

}


/* =====================================================
   FILTERS
===================================================== */

document
.querySelectorAll(".filter-btn")
.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {


                document
                .querySelectorAll(
                    ".filter-btn"
                )
                .forEach(
                    function(btn) {

                        btn.classList.remove(
                            "active"
                        );

                    }
                );


                this.classList.add(
                    "active"
                );


                currentFilter =
                    this.dataset.filter;


                renderMatches();

            }
        );

    }
);


/* =====================================================
   DARK MODE
===================================================== */

const darkBtn =
    document.getElementById(
        "darkBtn"
    );


function updateDarkButton() {

    darkBtn.textContent =

        document.body
        .classList
        .contains("dark")

        ? "☀️"

        : "🌙";

}


darkBtn.addEventListener(
    "click",
    function() {

        document.body
        .classList
        .toggle("dark");


        localStorage.setItem(
            "tactigol-dark",

            document.body
            .classList
            .contains("dark")
        );


        updateDarkButton();

    }
);


if (
    localStorage.getItem(
        "tactigol-dark"
    ) === "true"
) {

    document.body
    .classList
    .add("dark");

}


updateDarkButton();


/* =====================================================
   VISITOR TIME
===================================================== */

function updateVisitorTime() {

    const now =
        new Date();


    const time =
        now.toLocaleTimeString(
            [],
            {
                hour:
                    "2-digit",

                minute:
                    "2-digit",

                hour12:
                    false
            }
        );


    const hour =
        now.getHours();


    const icon =
        hour >= 6 &&
        hour < 19

        ? "☀️"

        : "🌙";


    const element =
        document.getElementById(
            "visitorTime"
        );


    if (element) {

        element.innerHTML =
            `${icon} <span>${time}</span>`;

    }

}


updateVisitorTime();


setInterval(
    updateVisitorTime,
    1000
);


/* =====================================================
   START
===================================================== */

loadMatches();

</script>
