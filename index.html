<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ألو معلم | الحرفيين والخدمات في المغرب</title>

    <meta name="description"
          content="ألو معلم منصة مغربية للعثور على الحرفيين والخدمات المهنية حسب المهنة والمدينة.">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: white;
            padding: 18px 6%;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #d62828;
        }

        .logo span {
            color: #16803c;
        }

        .hero {
            background: linear-gradient(
                135deg,
                #16803c,
                #0f6b32
            );

            color: white;
            padding: 65px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .search-box {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,.15);
        }

        .search-fields {
            display: grid;
            grid-template-columns:
                1fr 1fr 1.5fr auto;
            gap: 12px;
        }

        select,
        input,
        .search-btn {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
        }

        select,
        input {
            border: 1px solid #ddd;
            background: white;
            color: #222;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #16803c;
        }

        .search-btn {
            border: none;
            background: #d62828;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        .search-btn:hover {
            background: #b71f1f;
        }

        .clear-btn {
            margin-top: 12px;
            padding: 10px 20px;
            border: none;
            background: #eee;
            color: #333;
            border-radius: 8px;
            cursor: pointer;
        }

        .clear-btn:hover {
            background: #ddd;
        }

        .results-section {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .results-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .results-title h2 {
            margin-bottom: 8px;
        }

        .results-title p {
            color: #777;
        }

        #craftsmen {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
        }

        .craftsman {
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            text-align: center;
            transition: transform .2s,
                        box-shadow .2s;

            cursor: pointer;
        }

        .craftsman:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,.12);
        }

        .craftsman-photo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 15px;
        }

        .craftsman-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #16803c;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            margin: 0 auto 15px;
        }

        .craftsman h3 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .profession {
            color: #d62828;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .city {
            color: #666;
            margin-bottom: 12px;
        }

        .description {
            color: #555;
            line-height: 1.7;
            min-height: 50px;
            margin-bottom: 18px;
        }

        .contact-buttons {
            display: flex;
            gap: 10px;
        }

        .contact-buttons a {
            flex: 1;
            padding: 12px 8px;
            border-radius: 9px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        .call {
            background: #16803c;
        }

        .whatsapp {
            background: #25D366;
        }

        .empty {
            grid-column: 1 / -1;
            background: white;
            padding: 40px 20px;
            border-radius: 18px;
            text-align: center;
        }

        .empty h3 {
            margin-bottom: 10px;
        }

        .loading {
            grid-column: 1 / -1;
            background: white;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
        }

        footer {
            margin-top: 60px;
            background: #222;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        @media (max-width: 800px) {

            .search-fields {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 30px;
            }

            .hero {
                padding: 45px 15px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-content">

        <div class="logo">
            ألو <span>معلم</span>
        </div>

    </div>

</header>


<section class="hero">

    <h1>👷 ألو معلم</h1>

    <p>
        لقي المعلم اللي كتقلب عليه بسهولة
    </p>


    <div class="search-box">

        <div class="search-fields">


            <select id="profession">

                <option value="">
                    اختر المهنة
                </option>

                <option value="سباك">
                    🔧 سباك
                </option>

                <option value="كهربائي">
                    ⚡ كهربائي
                </option>

                <option value="صباغ">
                    🎨 صباغ
                </option>

                <option value="نجار">
                    🪚 نجار
                </option>

                <option value="بناء">
                    🧱 بناء
                </option>

                <option value="حداد">
                    🔩 حداد
                </option>

                <option value="تكييف">
                    ❄️ تكييف
                </option>

            </select>


            <select id="city">

                <option value="">
                    اختر المدينة
                </option>

                <option value="الرباط">
                    الرباط
                </option>

                <option value="سلا">
                    سلا
                </option>

                <option value="تمارة">
                    تمارة
                </option>

                <option value="الدار البيضاء">
                    الدار البيضاء
                </option>

                <option value="مراكش">
                    مراكش
                </option>

                <option value="فاس">
                    فاس
                </option>

                <option value="طنجة">
                    طنجة
                </option>

                <option value="مكناس">
                    مكناس
                </option>

                <option value="أكادير">
                    أكادير
                </option>

                <option value="القنيطرة">
                    القنيطرة
                </option>

                <option value="وجدة">
                    وجدة
                </option>

                <option value="تطوان">
                    تطوان
                </option>

                <option value="الناظور">
                    الناظور
                </option>

            </select>


            <input
                type="text"
                id="searchText"
                placeholder="🔎 ابحث باسم الحرفي أو الخدمة..."
            >


            <button
                type="button"
                class="search-btn"
                onclick="searchCraftsmen()"
            >
                🔎 ابحث
            </button>


        </div>


        <button
            type="button"
            class="clear-btn"
            onclick="clearSearch()"
        >
            مسح البحث
        </button>

    </div>

</section>


<section
    class="results-section"
    id="results"
>


    <div class="results-title">

        <h2>
            👷 الحرفيون المتاحون
        </h2>

        <p>
            اختار الحرفي المناسب وتواصل معه مباشرة
        </p>

    </div>


    <div id="craftsmen">

        <div class="loading">
            ⏳ جاري تحميل الحرفيين...
        </div>

    </div>


</section>


<footer>

    <p>
        © 2026 ألو معلم - جميع الحقوق محفوظة
    </p>

</footer>



<script>


const SUPABASE_URL =
    "https://kjmvewppokrzcbegxmwg.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_As8JEhEsIfOta6cyi6e_AA_tp-T9k0W";


const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let craftsmenData = [];



function escapeHtml(value) {

    return String(value ?? "")

        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}



function displayCraftsmen(list) {

    const container =
        document.getElementById(
            "craftsmen"
        );


    container.innerHTML = "";


    if (!list || list.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <h3>
                    😔 ما لقيناش حرفي بهاد المواصفات
                </h3>

                <p>
                    جرب مهنة أو مدينة أو اسم آخر.
                </p>

            </div>

        `;

        return;

    }


    list.forEach(function(craft) {


        const card =
            document.createElement("div");


        card.className =
            "craftsman";


        card.addEventListener(
            "click",
            function() {

                window.location.href =
                    "craftsman.html?id=" +
                    encodeURIComponent(
                        craft.id
                    );

            }
        );


        let photoHTML;


        if (craft.photo_url) {

            photoHTML = `

                <img
                    class="craftsman-photo"
                    src="${escapeHtml(
                        craft.photo_url
                    )}"
                    alt="${escapeHtml(
                        craft.name
                    )}"
                >

            `;

        } else {

            photoHTML = `

                <div class="craftsman-avatar">
                    👷
                </div>

            `;

        }


        const phone =
            String(craft.phone || "");


        const whatsappNumber =
            phone.startsWith("0")
                ? "212" + phone.substring(1)
                : phone;


        card.innerHTML = `

            ${photoHTML}


            <h3>
                👷 ${escapeHtml(
                    craft.name
                )}
            </h3>


            <div class="profession">
                ${escapeHtml(
                    craft.profession
                )}
            </div>


            <div class="city">
                📍 ${escapeHtml(
                    craft.city
                )}
            </div>


            <div class="description">

                ${escapeHtml(
                    craft.description || ""
                )}

            </div>


            <div class="contact-buttons">


                <a
                    class="call"
                    href="tel:${escapeHtml(
                        phone
                    )}"
                >
                    📞 اتصال
                </a>


                <a
                    class="whatsapp"
                    href="https://wa.me/${whatsappNumber}"
                    target="_blank"
                    rel="noopener"
                >
                    💬 WhatsApp
                </a>


            </div>

        `;


        card
            .querySelectorAll("a")
            .forEach(function(link) {

                link.addEventListener(
                    "click",
                    function(event) {

                        event.stopPropagation();

                    }
                );

            });


        container.appendChild(card);

    });

}



async function loadCraftsmen() {


    const { data, error } =
        await client

            .from("craftsmen")

            .select(
                "id,name,profession,city,phone,description,photo_url,status"
            )

            .eq(
                "status",
                "approved"
            )

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Supabase:",
            error
        );


        document.getElementById(
            "craftsmen"
        ).innerHTML = `

            <div class="empty">

                ❌ حدث خطأ أثناء تحميل الحرفيين.

            </div>

        `;

        return;

    }


    craftsmenData =
        data || [];


    displayCraftsmen(
        craftsmenData
    );

}



function searchCraftsmen() {


    const profession =
        document.getElementById(
            "profession"
        ).value;


    const city =
        document.getElementById(
            "city"
        ).value;


    const searchText =
        document.getElementById(
            "searchText"
        ).value
        .trim()
        .toLowerCase();


    const results =
        craftsmenData.filter(
            function(craft) {


                const name =
                    String(
                        craft.name || ""
                    ).toLowerCase();


                const professionText =
                    String(
                        craft.profession || ""
                    ).toLowerCase();


                const description =
                    String(
                        craft.description || ""
                    ).toLowerCase();


                const professionMatch =
                    !profession ||
                    craft.profession ===
                    profession;


                const cityMatch =
                    !city ||
                    craft.city === city;


                const textMatch =
                    !searchText ||
                    name.includes(
                        searchText
                    ) ||
                    professionText.includes(
                        searchText
                    ) ||
                    description.includes(
                        searchText
                    );


                return (
                    professionMatch &&
                    cityMatch &&
                    textMatch
                );

            }
        );


    displayCraftsmen(
        results
    );


    document.getElementById(
        "results"
    ).scrollIntoView({
        behavior: "smooth"
    });

}



function clearSearch() {


    document.getElementById(
        "profession"
    ).value = "";


    document.getElementById(
        "city"
    ).value = "";


    document.getElementById(
        "searchText"
    ).value = "";


    displayCraftsmen(
        craftsmenData
    );

}



document.getElementById(
    "profession"
).addEventListener(
    "change",
    searchCraftsmen
);


document.getElementById(
    "city"
).addEventListener(
    "change",
    searchCraftsmen
);


document.getElementById(
    "searchText"
).addEventListener(
    "input",
    searchCraftsmen
);



loadCraftsmen();


</script>


</body>

</html>
