<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سجّل كحرفي | ألو معلم</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: white;
            padding: 18px 6%;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #d62828;
        }

        .logo span {
            color: #16803c;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 20px;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 16px;
            font-family: inherit;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #16803c;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #116631;
        }

        button:disabled {
            opacity: .7;
            cursor: not-allowed;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #d62828;
            text-decoration: none;
            font-weight: bold;
        }

        .note {
            background: #fff8e6;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
        }

        #result {
            margin-top: 20px;
        }

        .success {
            background: #e5ffe9;
            color: #087522;
            padding: 15px;
            border-radius: 10px;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 15px;
            border-radius: 10px;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: monospace;
        }

        @media (max-width: 700px) {
            .container {
                margin: 20px auto;
            }

            .form-box {
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        ألو <span>معلم</span>
    </div>
</header>

<div class="container">

    <div class="form-box">

        <h1>👷 سجّل كحرفي</h1>

        <p class="intro">
            عرّف الزبائن بخدماتك وخليهم يلقاوك بسهولة.
        </p>

        <form id="registerForm">

            <label for="name">الاسم الكامل</label>

            <input
                type="text"
                id="name"
                placeholder="مثال: محمد العلوي"
                required
            >

            <label for="profession">المهنة</label>

            <select id="profession" required>
                <option value="">اختر المهنة</option>
                <option value="سباك">سباك</option>
                <option value="كهربائي">كهربائي</option>
                <option value="صباغ">صباغ</option>
                <option value="نجار">نجار</option>
                <option value="بناء">بناء</option>
                <option value="حداد">حداد</option>
                <option value="تكييف">تكييف</option>
                <option value="أخرى">أخرى</option>
            </select>

            <label for="city">المدينة</label>

            <select id="city" required>
                <option value="">اختر المدينة</option>
                <option value="الرباط">الرباط</option>
                <option value="سلا">سلا</option>
                <option value="تمارة">تمارة</option>
                <option value="الدار البيضاء">الدار البيضاء</option>
                <option value="مراكش">مراكش</option>
                <option value="فاس">فاس</option>
                <option value="طنجة">طنجة</option>
                <option value="مكناس">مكناس</option>
                <option value="أكادير">أكادير</option>
                <option value="القنيطرة">القنيطرة</option>
                <option value="وجدة">وجدة</option>
                <option value="الناظور">الناظور</option>
                <option value="تطوان">تطوان</option>
                <option value="الحسيمة">الحسيمة</option>
                <option value="الجديدة">الجديدة</option>
                <option value="آسفي">آسفي</option>
                <option value="بني ملال">بني ملال</option>
                <option value="خريبكة">خريبكة</option>
                <option value="العيون">العيون</option>
                <option value="الداخلة">الداخلة</option>
                <option value="الرشيدية">الرشيدية</option>
                <option value="ورزازات">ورزازات</option>
                <option value="تارودانت">تارودانت</option>
                <option value="إنزكان">إنزكان</option>
            </select>

            <label for="phone">رقم الهاتف</label>

            <input
                type="tel"
                id="phone"
                placeholder="مثال: 0612345678"
                required
            >

            <label for="description">وصف الخدمات</label>

            <textarea
                id="description"
                placeholder="مثال: إصلاح تسربات المياه، تركيب الحنفيات..."
            ></textarea>

            <button type="submit" id="submitButton">
                📩 إرسال طلب التسجيل
            </button>

        </form>

        <div id="result"></div>

        <div class="note">
            ℹ️ سيتم مراجعة طلب التسجيل قبل ظهور بيانات الحرفي للزبائن.
        </div>

        <a class="back" href="index.html">
            ← العودة إلى الصفحة الرئيسية
        </a>

    </div>

</div>

<script>
const SUPABASE_URL = "https://kjmvewppokrzcbegxmwg.supabase.co";
const SUPABASE_KEY = "sb_publishable_As8JEhEsIfOta6cyi6e_AA_tp-T9k0W";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const form = document.getElementById("registerForm");
const submitButton = document.getElementById("submitButton");
const resultBox = document.getElementById("result");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    resultBox.innerHTML = "";

    submitButton.disabled = true;
    submitButton.textContent = "⏳ جاري الإرسال...";

    const name = document.getElementById("name").value.trim();
    const profession = document.getElementById("profession").value;
    const city = document.getElementById("city").value;
    const phone = document.getElementById("phone").value.trim();
    const description = document.getElementById("description").value.trim();

    try {

        const { error } = await client
    .from("craftsmen")
    .insert({
        name: name,
        profession: profession,
        city: city,
        phone: phone,
        description: description,
        status: "pending"
    });

        if (error) {

            console.error("Supabase error:", error);

            resultBox.innerHTML =
                "<div class='error'>" +
                "❌ فشل الحفظ\n\n" +
                JSON.stringify(error, null, 2) +
                "</div>";

            return;
        }
        

        resultBox.innerHTML =
            "<div class='success'>" +
            "✅ تم إرسال طلب التسجيل بنجاح!<br><br>" +
            "سيتم مراجعة معلوماتك قبل ظهورها للزبائن." +
            "</div>";

        form.reset();

    } catch (error) {

        console.error("Unexpected error:", error);

        resultBox.innerHTML =
            "<div class='error'>" +
            "❌ حدث خطأ غير متوقع\n\n" +
            error.message +
            "</div>";

    } finally {

        submitButton.disabled = false;
        submitButton.textContent = "📩 إرسال طلب التسجيل";

    }

});
</script>

</body>
</html>
