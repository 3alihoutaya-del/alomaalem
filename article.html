<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TactiGol News | الخبر</title>

    <meta name="description"
          content="TactiGol News - أخبار كرة القدم المغربية والعالمية">

    <meta name="theme-color"
          content="#07111f">


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Arial,
                Tahoma,
                sans-serif;

            background: #f3f5f7;

            color: #17202a;

            line-height: 1.8;

            transition:
                background .25s,
                color .25s;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }


        :root {

            --dark: #07111f;

            --dark2: #0d1b2a;

            --green: #00a86b;

            --green-dark: #087f56;

            --red: #e63946;

            --white: #ffffff;

            --bg: #f3f5f7;

            --card: #ffffff;

            --text: #17202a;

            --muted: #77808a;

            --border: #e2e6ea;

            --shadow:
                0 6px 20px rgba(0,0,0,.06);
        }


        body.dark {

            --bg: #09111d;

            --card: #101a29;

            --text: #f4f7fa;

            --muted: #a8b2bd;

            --border: #263548;
        }


        /* HEADER */

        .header {

            background:
                linear-gradient(
                    135deg,
                    #07111f,
                    #0c1d30
                );

            color: white;

            position: sticky;

            top: 0;

            z-index: 1000;

            box-shadow:
                0 4px 20px rgba(0,0,0,.18);
        }


        .header-inner {

            max-width: 1250px;

            min-height: 72px;

            margin: auto;

            padding:
                10px 18px;

            display: flex;

            align-items: center;

            gap: 25px;
        }


        .logo {

            font-size: 28px;

            font-weight: 900;

            white-space: nowrap;
        }


        .logo span {

            color: var(--green);
        }


        .logo small {

            display: block;

            text-align: center;

            color: #9ca9b7;

            font-size: 9px;

            letter-spacing: 3px;

            margin-top: -7px;
        }


        .nav {

            display: flex;

            align-items: center;

            gap: 4px;

            flex: 1;

            overflow-x: auto;
        }


        .nav::-webkit-scrollbar {

            display: none;
        }


        .nav a {

            color: #d8e1e9;

            padding:
                8px 12px;

            border-radius: 7px;

            font-size: 14px;

            white-space: nowrap;
        }


        .nav a:hover {

            background: #14273b;

            color: white;
        }


        .actions {

            display: flex;

            gap: 8px;
        }


        .icon-btn {

            width: 40px;

            height: 40px;

            border: 1px solid #26384b;

            border-radius: 8px;

            background: #102033;

            color: white;

            cursor: pointer;

            font-size: 17px;
        }


        /* CONTAINER */

        .container {

            max-width: 1050px;

            margin: auto;

            padding:
                25px 18px 60px;
        }


        /* BREADCRUMB */

        .breadcrumb {

            margin-bottom: 15px;

            color: var(--muted);

            font-size: 13px;
        }


        .breadcrumb a {

            color: var(--green);

            font-weight: bold;
        }


        /* ARTICLE */

        .article {

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 14px;

            overflow: hidden;

            box-shadow: var(--shadow);
        }


        .article-header {

            padding:
                28px 30px 15px;
        }


        .category {

            display: inline-block;

            background: var(--green);

            color: white;

            border-radius: 5px;

            padding:
                4px 10px;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 12px;
        }


        .article-title {

            font-size: 38px;

            line-height: 1.4;

            margin-bottom: 13px;
        }


        .article-meta {

            display: flex;

            flex-wrap: wrap;

            gap: 15px;

            color: var(--muted);

            font-size: 13px;

            border-bottom:
                1px solid var(--border);

            padding-bottom: 17px;
        }


        .article-image {

            width: 100%;

            max-height: 570px;

            object-fit: cover;
        }


        .article-body {

            padding:
                30px;
        }


        .article-content {

            font-size: 18px;

            line-height: 2;

            color: var(--text);

            white-space: pre-line;
        }


        .article-content p {

            margin-bottom: 20px;
        }


        /* SHARE */

        .share {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-top: 30px;

            padding-top: 20px;

            border-top:
                1px solid var(--border);
        }


        .share-title {

            font-weight: bold;

            margin-left: 8px;
        }


        .share-btn {

            border: 0;

            border-radius: 7px;

            padding:
                8px 12px;

            cursor: pointer;

            color: white;

            font-weight: bold;
        }


        .facebook {

            background: #1877f2;
        }


        .whatsapp {

            background: #16a34a;
        }


        .copy {

            background: #64748b;
        }


        /* RELATED */

        .related {

            margin-top: 30px;
        }


        .section-title {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 13px;
        }


        .section-title h2 {

            font-size: 21px;

            display: flex;

            align-items: center;

            gap: 9px;
        }


        .section-title h2::before {

            content: "";

            width: 5px;

            height: 25px;

            background: var(--green);

            border-radius: 5px;
        }


        .news-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 13px;
        }


        .news-card {

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 10px;

            overflow: hidden;

            box-shadow: var(--shadow);

            transition: .2s;
        }


        .news-card:hover {

            transform:
                translateY(-3px);
        }


        .news-image {

            aspect-ratio: 16 / 9;

            overflow: hidden;
        }


        .news-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;
        }


        .news-content {

            padding: 12px;
        }


        .news-category {

            color: var(--green);

            font-size: 11px;

            font-weight: bold;
        }


        .news-title {

            font-size: 15px;

            line-height: 1.5;

            margin-top: 4px;

            display: -webkit-box;

            -webkit-line-clamp: 2;

            -webkit-box-orient: vertical;

            overflow: hidden;
        }


        .news-date {

            color: var(--muted);

            font-size: 10px;

            margin-top: 7px;
        }


        /* LOADING */

        .loading {

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 12px;

            padding: 35px;

            text-align: center;

            color: var(--muted);
        }


        .error {

            background: var(--card);

            border: 1px solid #ef4444;

            border-radius: 12px;

            padding: 25px;

            text-align: center;

            color: #dc2626;
        }


        /* FOOTER */

        footer {

            background: #050c15;

            color: #b8c3ce;

            padding:
                30px 18px;
        }


        .footer-inner {

            max-width: 1050px;

            margin: auto;

            text-align: center;
        }


        .footer-logo {

            color: white;

            font-size: 24px;

            font-weight: 900;
        }


        .footer-logo span {

            color: var(--green);
        }


        .copyright {

            margin-top: 10px;

            font-size: 12px;

            color: #8794a1;
        }


        /* MOBILE */

        @media(max-width: 800px) {

            .header-inner {

                flex-wrap: wrap;
            }

            .nav {

                order: 3;

                flex-basis: 100%;
            }

            .article-title {

                font-size: 29px;
            }

            .news-grid {

                grid-template-columns:
                    repeat(2,1fr);
            }

        }


        @media(max-width: 550px) {

            .container {

                padding:
                    15px 10px 40px;
            }

            .article-header {

                padding:
                    20px 17px 10px;
            }

            .article-body {

                padding:
                    20px 17px;
            }

            .article-title {

                font-size: 24px;
            }

            .article-content {

                font-size: 16px;

                line-height: 1.9;
            }

            .news-grid {

                grid-template-columns: 1fr;
            }

            .share {

                flex-wrap: wrap;
            }

        }

    </style>

</head>

    <div class="header-inner">


        <a

            class="logo"
        >

            Tacti<span>Gol</span>

            <small>

        </a>


        <nav class="nav">

            <a href="index.html">

        <div class="actions">

<main class="container">

<!-- FOOTER -->

<footer>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://kjmvewppokrzcbegxmwg.supabase.co";


/*
    ضع نفس Publishable / Anon Key
    الذي يعمل عندك في index.html
    و admin.html
*/

const SUPABASE_KEY =
    "sb_publishable_As8JEhEsIfOta6cyi6e_AA_tp-T9k0W";


const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   DEFAULT IMAGE
===================================================== */

const DEFAULT_IMAGE =
    "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1200&q=80";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =====================================================
   DATE
===================================================== */

function formatDate(date) {

    if (!date)
        return "";

    const d =
        new Date(date);


    if (
        Number.isNaN(
            d.getTime()
        )
    )
        return "";


    return d.toLocaleDateString(
        "ar-MA",
        {
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    );

}


/* =====================================================
   GET ARTICLE ID
===================================================== */

function getArticleId() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    return params.get("id");

}


/* =====================================================
   ARTICLE CARD
===================================================== */

function articleCard(article) {

    const image =
        article.image_url ||
        DEFAULT_IMAGE;


    return `

        <article class="news-card">

            <a
                href="article.html?id=${encodeURIComponent(article.id)}"
            >


                <div class="news-image">

                    <img
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(article.title)}"
                        loading="lazy"
                    >

                </div>


                <div class="news-content">


                    <div class="news-category">

                        ${escapeHtml(
                            article.category ||
                            "أخبار"
                        )}

                    </div>


                    <h3 class="news-title">

                        ${escapeHtml(
                            article.title
                        )}

                    </h3>


                    <div class="news-date">

                        ${formatDate(
                            article.created_at
                        )}

                    </div>


                </div>

            </a>

        </article>

    `;

}


/* =====================================================
   LOAD ARTICLE
===================================================== */

async function loadArticle() {

    const articleBox =
        document.getElementById(
            "articleBox"
        );


    const id =
        getArticleId();


    if (!id) {

        articleBox.innerHTML = `

            <div class="error">

                ❌ لم يتم تحديد الخبر.

                <br><br>

                <a
                    href="index.html"
                    style="color:#00a86b;font-weight:bold;"
                >
                    ← العودة إلى الأخبار
                </a>

            </div>

        `;

        return;

    }


    try {


        const result =
            await client
            .from("articles")
            .select("*")
            .eq(
                "id",
                id
            )
            .eq(
                "status",
                "published"
            )
            .single();


        if (result.error) {

            console.error(
                "❌ Article:",
                result.error
            );


            articleBox.innerHTML = `

                <div class="error">

                    ❌ لم يتم العثور على الخبر.

                    <br><br>

                    <a
                        href="index.html"
                        style="color:#00a86b;font-weight:bold;"
                    >
                        ← العودة إلى الأخبار
                    </a>

                </div>

            `;

            return;

        }


        const article =
            result.data;


        renderArticle(
            article
        );


        loadRelated(
            article
        );


    }
    catch (error) {

        console.error(
            "❌ Error:",
            error
        );


        articleBox.innerHTML = `

            <div class="error">

                ❌ حدث خطأ أثناء تحميل الخبر.

            </div>

        `;

    }

}


/* =====================================================
   RENDER ARTICLE
===================================================== */

function renderArticle(article) {

    const articleBox =
        document.getElementById(
            "articleBox"
        );


    const image =
        article.image_url ||
        DEFAULT_IMAGE;


    const title =
        article.title ||
        "بدون عنوان";


    const category =
        article.category ||
        "أخبار";


    const author =
        article.author ||
        "TactiGol News";


    const content =
        article.content ||
        article.excerpt ||
        "لا يوجد محتوى لهذا الخبر.";


    document.title =
        title +
        " | TactiGol News";


    articleBox.innerHTML = `

        <div class="article-header">


            <span class="category">

                ${escapeHtml(category)}

            </span>


            <h1 class="article-title">

                ${escapeHtml(title)}

            </h1>


            <div class="article-meta">


                <span>

                    📅

                    ${formatDate(
                        article.created_at
                    )}

                </span>


                <span>

                    ✍️

                    ${escapeHtml(author)}

                </span>


                <span>

                    ⚽ TactiGol News

                </span>


            </div>


        </div>


        <img
            class="article-image"
            src="${escapeHtml(image)}"
            alt="${escapeHtml(title)}"
        >


        <div class="article-body">


            <div class="article-content">

                ${escapeHtml(content)}

            </div>


            <div class="share">


                <span class="share-title">

                    مشاركة الخبر:

                </span>


                <button
                    class="share-btn whatsapp"
                    type="button"
                    onclick="shareWhatsApp()"
                >
                    WhatsApp
                </button>


                <button
                    class="share-btn facebook"
                    type="button"
                    onclick="shareFacebook()"
                >
                    Facebook
                </button>


                <button
                    class="share-btn copy"
                    type="button"
                    onclick="copyArticleUrl()"
                >
                    نسخ الرابط
                </button>


            </div>


        </div>

    `;

}


/* =====================================================
   RELATED ARTICLES
===================================================== */

async function loadRelated(article) {

    const section =
        document.getElementById(
            "relatedSection"
        );


    const grid =
        document.getElementById(
            "relatedGrid"
        );


    try {


        let query =
            client
            .from("articles")
            .select(
                "id,title,category,image_url,created_at"
            )
            .eq(
                "status",
                "published"
            )
            .neq(
                "id",
                article.id
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            )
            .limit(3);


        if (article.category) {

            query =
                query.eq(
                    "category",
                    article.category
                );

        }


        const result =
            await query;


        if (
            result.error ||
            !result.data ||
            !result.data.length
        ) {

            return;

        }


        grid.innerHTML =
            result.data
            .map(articleCard)
            .join("");


        section.style.display =
            "block";


    }
    catch(error) {

        console.warn(
            "Related articles:",
            error
        );

    }

}


/* =====================================================
   WHATSAPP
===================================================== */

function shareWhatsApp() {

    const url =
        window.location.href;


    const text =
        document.title;


    window.open(
        "https://wa.me/?text=" +
        encodeURIComponent(
            text + "\n" + url
        ),
        "_blank"
    );

}


/* =====================================================
   FACEBOOK
===================================================== */

function shareFacebook() {

    const url =
        window.location.href;


    window.open(
        "https://www.facebook.com/sharer/sharer.php?u=" +
        encodeURIComponent(url),
        "_blank"
    );

}


/* =====================================================
   COPY URL
===================================================== */

async function copyArticleUrl() {

    try {

        await navigator.clipboard.writeText(
            window.location.href
        );


        alert(
            "✅ تم نسخ رابط الخبر"
        );


    }
    catch(error) {

        alert(
            "انسخ الرابط من شريط المتصفح"
        );

    }

}


/* =====================================================
   DARK MODE
===================================================== */

const darkBtn =
    document.getElementById(
        "darkBtn"
    );


function updateDarkButton() {

    darkBtn.textContent =
        document.body.classList.contains(
            "dark"
        )
        ? "☀️"
        : "🌙";

}


darkBtn.addEventListener(
    "click",
    function() {

        document.body.classList.toggle(
            "dark"
        );


        const dark =
            document.body.classList.contains(
                "dark"
            );


        localStorage.setItem(
            "tactigol-dark",
            dark
        );


        updateDarkButton();

    }
);


if (
    localStorage.getItem(
        "tactigol-dark"
    ) === "true"
) {

    document.body.classList.add(
        "dark"
    );

}


updateDarkButton();


/* =====================================================
   START
===================================================== */

loadArticle();

</script>


</body>

</html>
