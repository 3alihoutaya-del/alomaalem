<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>المباريات | TactiGol News</title>

<meta name="description"
content="جميع مباريات كرة القدم والنتائج والمواعيد على TactiGol News">

<meta name="theme-color"
content="#07111f">


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Arial,
        Tahoma,
        sans-serif;

    background:#f3f5f7;

    color:#17202a;

    line-height:1.7;

    transition:
        background .25s,
        color .25s;
}

a{
    text-decoration:none;
    color:inherit;
}

button{
    font-family:inherit;
}


/* =====================================================
   VARIABLES
===================================================== */

:root{

    --dark:#07111f;

    --dark2:#0d1b2a;

    --green:#00a86b;

    --green-dark:#087f56;

    --red:#e63946;

    --white:#ffffff;

    --bg:#f3f5f7;

    --card:#ffffff;

    --text:#17202a;

    --muted:#77808a;

    --border:#e2e6ea;

    --shadow:
        0 6px 20px rgba(0,0,0,.06);

}


/* =====================================================
   DARK
===================================================== */

body.dark{

    --bg:#09111d;

    --card:#101a29;

    --text:#f4f7fa;

    --muted:#a8b2bd;

    --border:#263548;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    background:
        linear-gradient(
            135deg,
            #07111f,
            #0c1d30
        );

    color:white;

    position:sticky;

    top:0;

    z-index:1000;

    box-shadow:
        0 4px 20px rgba(0,0,0,.18);

}


.header-inner{

    max-width:1250px;

    min-height:72px;

    margin:auto;

    padding:
        10px 18px;

    display:flex;

    align-items:center;

    gap:25px;

}


.logo{

    font-size:28px;

    font-weight:900;

    white-space:nowrap;

}


.logo span{

    color:var(--green);

}


.logo small{

    display:block;

    text-align:center;

    color:#9ca9b7;

    font-size:9px;

    letter-spacing:3px;

    margin-top:-7px;

}


.nav{

    display:flex;

    align-items:center;

    gap:4px;

    flex:1;

    overflow-x:auto;

}


.nav::-webkit-scrollbar{

    display:none;

}


.nav a{

    color:#d8e1e9;

    padding:
        8px 12px;

    border-radius:7px;

    font-size:14px;

    white-space:nowrap;

}


.nav a:hover{

    background:#14273b;

    color:white;

}


.nav a.active{

    background:var(--green);

    color:white;

}


.actions{

    display:flex;

    gap:8px;

}


.icon-btn{

    width:40px;

    height:40px;

    border:1px solid #26384b;

    border-radius:8px;

    background:#102033;

    color:white;

    cursor:pointer;

    font-size:17px;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    max-width:1150px;

    margin:auto;

    padding:
        25px 18px 60px;

}


/* =====================================================
   PAGE TITLE
===================================================== */

.page-header{

    background:
        linear-gradient(
            135deg,
            #07111f,
            #102941
        );

    color:white;

    border-radius:14px;

    padding:
        28px;

    margin-bottom:20px;

}


.page-header h1{

    font-size:30px;

}


.page-header p{

    color:#b9c7d4;

    margin-top:5px;

    font-size:14px;

}


/* =====================================================
   FILTERS
===================================================== */

.filters{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:13px;

    margin-bottom:20px;

    box-shadow:var(--shadow);

    display:flex;

    gap:8px;

    flex-wrap:wrap;

}


.filter-btn{

    border:1px solid var(--border);

    background:var(--bg);

    color:var(--text);

    padding:
        8px 16px;

    border-radius:7px;

    cursor:pointer;

    font-weight:bold;

}


.filter-btn:hover{

    border-color:var(--green);

}


.filter-btn.active{

    background:var(--green);

    color:white;

    border-color:var(--green);

}


/* =====================================================
   DAY GROUP
===================================================== */

.day-group{

    margin-bottom:25px;

}


.day-title{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:10px;

}


.day-title h2{

    font-size:19px;

}


.day-title::before{

    content:"";

    width:5px;

    height:24px;

    background:var(--green);

    border-radius:5px;

}


/* =====================================================
   MATCH GRID
===================================================== */

.matches-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;

}


/* =====================================================
   MATCH CARD
===================================================== */

.match-card{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:16px;

    box-shadow:var(--shadow);

    transition:
        transform .2s,
        box-shadow .2s;

}


.match-card:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 12px 25px rgba(0,0,0,.09);

}


.match-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:12px;

}


.competition{

    color:var(--green);

    font-weight:bold;

    font-size:12px;

}


.status{

    font-size:11px;

    padding:
        3px 8px;

    border-radius:20px;

    background:#edf2f7;

    color:#475569;

}


.status.live{

    background:#fee2e2;

    color:#dc2626;

}


.status.finished{

    background:#e2e8f0;

    color:#475569;

}


.status.scheduled{

    background:#dcfce7;

    color:#15803d;

}


.status.postponed{

    background:#fef3c7;

    color:#b45309;

}


body.dark .status{

    background:#1e293b;

    color:#cbd5e1;

}


body.dark .status.live{

    background:#451a1a;

    color:#fca5a5;

}


body.dark .status.scheduled{

    background:#12372b;

    color:#86efac;

}


/* =====================================================
   TEAMS
===================================================== */

.teams{

    display:grid;

    grid-template-columns:
        1fr 90px 1fr;

    align-items:center;

    gap:8px;

}


.team{

    text-align:center;

    font-weight:bold;

    font-size:14px;

}


.team-logo{

    width:42px;

    height:42px;

    object-fit:contain;

    margin:
        0 auto 6px;

}


.no-logo{

    width:42px;

    height:42px;

    margin:
        0 auto 6px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #dfe6ec,
            #aeb9c4
        );

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:20px;

}


body.dark .no-logo{

    background:#263548;

}


.score-box{

    text-align:center;

}


.score{

    font-size:24px;

    font-weight:900;

}


.time{

    color:var(--muted);

    font-size:12px;

    margin-top:3px;

}


.stadium{

    color:var(--muted);

    font-size:11px;

    text-align:center;

    margin-top:12px;

    padding-top:9px;

    border-top:
        1px solid var(--border);

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:40px;

    text-align:center;

    color:var(--muted);

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:35px;

    text-align:center;

    color:var(--muted);

}


/* =====================================================
   ERROR
===================================================== */

.error{

    background:var(--card);

    border:1px solid #ef4444;

    border-radius:12px;

    padding:30px;

    text-align:center;

    color:#dc2626;

}


/* =====================================================
   FOOTER
===================================================== */

footer{

    background:#050c15;

    color:#b8c3ce;

    padding:
        30px 18px;

}


.footer-inner{

    max-width:1150px;

    margin:auto;

    text-align:center;

}


.footer-logo{

    color:white;

    font-size:24px;

    font-weight:900;

}


.footer-logo span{

    color:var(--green);

}


.copyright{

    margin-top:8px;

    color:#8794a1;

    font-size:12px;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:800px){

    .header-inner{

        flex-wrap:wrap;

    }


    .nav{

        order:3;

        flex-basis:100%;

    }


    .matches-grid{

        grid-template-columns:1fr;

    }

}


@media(max-width:550px){

    .container{

        padding:
            15px 10px 40px;

    }


    .page-header{

        padding:22px;

    }


    .page-header h1{

        font-size:25px;

    }


    .teams{

        grid-template-columns:
            1fr 70px 1fr;

    }


    .team{

        font-size:12px;

    }


    .score{

        font-size:21px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="header-inner">


        <a
            href="index.html"
            class="logo"
        >

            Tacti<span>Gol</span>

            <small>
                NEWS
            </small>

        </a>


        <nav class="nav">

            <a href="index.html">
                الرئيسية
            </a>

            <a
                href="matches.html"
                class="active"
            >
                ⚽ المباريات
            </a>

            <a href="index.html#latest">
                📰 الأخبار
            </a>

            <a href="index.html#morocco">
                🇲🇦 المغرب
            </a>

            <a href="index.html#world">
                🌍 عالمي
            </a>

            <a href="index.html#transfers">
                🔥 الانتقالات
            </a>

            <a href="index.html#tactics">
                🎯 تكتيك
            </a>

        </nav>


        <div class="actions">

            <button
                class="icon-btn"
                id="darkBtn"
                type="button"
            >
                🌙
            </button>

        </div>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <section class="page-header">

        <h1>
            ⚽ مباريات كرة القدم
        </h1>

        <p>
            جميع المباريات والنتائج والمواعيد على TactiGol News
        </p>

    </section>


    <!-- FILTERS -->

    <div class="filters">

        <button
            class="filter-btn active"
            data-filter="all"
        >
            الكل
        </button>

        <button
            class="filter-btn"
            data-filter="scheduled"
        >
            ⏰ القادمة
        </button>

        <button
            class="filter-btn"
            data-filter="live"
        >
            🔴 مباشر
        </button>

        <button
            class="filter-btn"
            data-filter="finished"
        >
            ✅ انتهت
        </button>

        <button

        >
            ⏸️ مؤجلة
        </button>

    </div>


    <!-- MATCHES -->

    <div id="matchesContainer">

        <div class="loading">

            ⏳ جاري تحميل المباريات...

        </div>

    </div>


</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <div class="footer-inner">

        <div class="footer-logo">

            Tacti<span>Gol</span> News

        </div>

        <div class="copyright">

            © 2026 TactiGol News
            — جميع الحقوق محفوظة

        </div>

    </div>

</footer>


<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://kjmvewppokrzcbegxmwg.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_As8JEhEsIfOta6cyi6e_AA_tp-T9k0W";


const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   VARIABLES
===================================================== */

let allMatches = [];

let currentFilter = "all";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   STATUS
===================================================== */

function statusText(status){

    switch(status){

        case "live":
            return "🔴 مباشر";

        case "finished":
            return "انتهت";

        case "postponed":
            return "مؤجلة";

        case "scheduled":
            return "قادمة";

        default:
            return status || "قادمة";

    }

}


/* =====================================================
   STATUS CLASS
===================================================== */

function statusClass(status){

    if(
        [
            "live",
            "finished",
            "scheduled",
            "postponed"
        ].includes(status)
    ){

        return status;

    }

    return "scheduled";

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(date){

    const d =
        new Date(date);


    if(
        Number.isNaN(
            d.getTime()
        )
    ){

        return "";

    }


    return d.toLocaleTimeString(
        "ar-MA",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date){

    const d =
        new Date(date);


    if(
        Number.isNaN(
            d.getTime()
        )
    ){

        return "";

    }


    return d.toLocaleDateString(
        "ar-MA",
        {
            weekday:"long",
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    );

}


/* =====================================================
   DATE KEY
===================================================== */

function dateKey(date){

    const d =
        new Date(date);


    if(
        Number.isNaN(
            d.getTime()
        )
    ){

        return "unknown";

    }


    return d.toLocaleDateString(
        "en-CA"
    );

}


/* =====================================================
   TEAM LOGO
===================================================== */

function teamLogo(
    url,
    team
){

    if(url){

        return `

            <img
                src="${escapeHtml(url)}"
                alt="${escapeHtml(team)}"
                class="team-logo"
                loading="lazy"
            >

        `;

    }


    return `

        <div class="no-logo">
            ⚽
        </div>

    `;

}


/* =====================================================
   RENDER MATCH
===================================================== */

function renderMatch(match){

    const homeScore =
        match.home_score ??
        "-";


    const awayScore =
        match.away_score ??
        "-";


    const status =
        match.status ||
        "scheduled";


    return `

        <article
            class="match-card"
            data-status="${escapeHtml(status)}"
        >


            <div class="match-top">


                <div class="competition">

                    🏆

                    ${escapeHtml(
                        match.competition ||
                        "كرة القدم"
                    )}

                </div>


                <span
                    class="status ${statusClass(status)}"
                >

                    ${statusText(status)}

                </span>


            </div>


            <div class="teams">


                <div class="team">

                    ${teamLogo(
                        match.home_logo,
                        match.home_team
                    )}


                    <div>

                        ${escapeHtml(
                            match.home_team
                        )}

                    </div>

                </div>


                <div class="score-box">


                    <div class="score">

                        ${homeScore}
                        -
                        ${awayScore}

                    </div>


                    <div class="time">

                        ${formatTime(
                            match.match_date
                        )}

                    </div>


                </div>


                <div class="team">

                    ${teamLogo(
                        match.away_logo,
                        match.away_team
                    )}


                    <div>

                        ${escapeHtml(
                            match.away_team
                        )}

                    </div>

                </div>


            </div>


            ${
                match.stadium
                ?
                `

                <div class="stadium">

                    🏟️

                    ${escapeHtml(
                        match.stadium
                    )}

                </div>

                `
                :
                ""
            }


        </article>

    `;

}


/* =====================================================
   RENDER MATCHES
===================================================== */

function renderMatches(){

    const container =
        document.getElementById(
            "matchesContainer"
        );


    let filtered =
        allMatches;


    if(
        currentFilter !== "all"
    ){

        filtered =
            allMatches.filter(
                function(match){

                    return(
                        match.status ===
                        currentFilter
                    );

                }
            );

    }


    if(!filtered.length){

        container.innerHTML = `

            <div class="empty">

                لا توجد مباريات في هذا القسم حاليًا.

            </div>

        `;

        return;

    }


    const groups = {};


    filtered.forEach(
        function(match){

            const key =
                dateKey(
                    match.match_date
                );


            if(
                !groups[key]
            ){

                groups[key] = [];

            }


            groups[key].push(
                match
            );

        }
    );


    let html = "";


    Object.keys(groups)
    .sort()
    .forEach(
        function(key){

            const list =
                groups[key];


            const title =
                formatDate(
                    list[0].match_date
                );


            html += `

                <section
                    class="day-group"
                >


                    <div class="day-title">

                        <h2>

                            ${escapeHtml(
                                title
                            )}

                        </h2>

                    </div>


                    <div class="matches-grid">

                        ${list
                            .map(renderMatch)
                            .join("")
                        }

                    </div>


                </section>

            `;

        }
    );


    container.innerHTML =
        html;

}


/* =====================================================
   LOAD MATCHES
===================================================== */

async function loadMatches(){

    const container =
        document.getElementById(
            "matchesContainer"
        );


    try{

        const result =
            await client
            .from("matches")
            .select("*")
            .order(
                "match_date",
                {
                    ascending:true
                }
            )
            .limit(100);


        if(result.error){

            console.error(
                "❌ Supabase matches:",
                result.error
            );


            container.innerHTML = `

                <div class="error">

                    ❌ حدث خطأ أثناء تحميل المباريات.

                    <br><br>

                    <small>

                        ${escapeHtml(
                            result.error.message
                        )}

                    </small>

                </div>

            `;

            return;

        }


        allMatches =
            result.data || [];


        renderMatches();


    }
    catch(error){

        console.error(
            "❌ Matches error:",
            error
        );


        container.innerHTML = `

            <div class="error">

                ❌ تعذر الاتصال بقاعدة بيانات المباريات.

            </div>

        `;

    }

}


/* =====================================================
   FILTER BUTTONS
===================================================== */

document
.querySelectorAll(
    ".filter-btn"
)
.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                document
                .querySelectorAll(
                    ".filter-btn"
                )
                .forEach(
                    function(btn){

                        btn.classList.remove(
                            "active"
                        );

                    }
                );


                button.classList.add(
                    "active"
                );


                currentFilter =
                    button.dataset.filter;


                renderMatches();

            }
        );

    }
);


/* =====================================================
   DARK MODE
===================================================== */

const darkBtn =
    document.getElementById(
        "darkBtn"
    );


function updateDarkButton(){

    darkBtn.textContent =
        document.body.classList.contains(
            "dark"
        )
        ? "☀️"
        : "🌙";

}


darkBtn.addEventListener(
    "click",
    function(){

        document.body.classList.toggle(
            "dark"
        );


        const dark =
            document.body.classList.contains(
                "dark"
            );


        localStorage.setItem(
            "tactigol-dark",
            dark
        );


        updateDarkButton();

    }
);


if(
    localStorage.getItem(
        "tactigol-dark"
    ) === "true"
){

    document.body.classList.add(
        "dark"
    );

}


updateDarkButton();


/* =====================================================
   START
===================================================== */

loadMatches();

</script>


</body>

</html>
