<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>المباريات | TactiGol News</title>

<meta name="description"
      content="جميع مباريات كرة القدم - TactiGol News">

<style>

/* =====================================================
   ROOT
===================================================== */

:root {

    --primary: #00a86b;
    --primary-dark: #087f56;

    --bg: #f4f6f8;
    --card: #ffffff;

    --text: #111827;
    --muted: #6b7280;

    --border: #e5e7eb;

    --shadow:
        0 6px 22px rgba(0,0,0,.07);
}


/* =====================================================
   DARK
===================================================== */

body.dark {

    --bg: #07111f;
    --card: #0f1b2b;

    --text: #f3f4f6;
    --muted: #aab4c0;

    --border: #263548;
}


/* =====================================================
   RESET
===================================================== */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;
}


html {

    scroll-behavior: smooth;
}


body {

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    background: var(--bg);

    color: var(--text);

    line-height: 1.7;

    transition:
        background .25s,
        color .25s;
}


a {

    color: inherit;

    text-decoration: none;
}


button,
input {

    font-family: inherit;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    background:
        linear-gradient(
            135deg,
            #07111f,
            #0d2136
        );

    color: white;

    position: sticky;

    top: 0;

    z-index: 1000;

    box-shadow:
        0 4px 20px rgba(0,0,0,.18);
}


.header-inner {

    max-width: 1250px;

    min-height: 72px;

    margin: auto;

    padding:
        10px 18px;

    display: flex;

    align-items: center;

    gap: 20px;
}


/* =====================================================
   LOGO
===================================================== */

.logo {

    min-width: 150px;

    font-size: 27px;

    font-weight: 900;

    line-height: 1.1;
}


.logo span {

    color: var(--primary);
}


.logo small {

    display: block;

    color: #9ca9b7;

    font-size: 8px;

    letter-spacing: 4px;

    text-align: center;
}


/* =====================================================
   NAV
===================================================== */

.nav {

    display: flex;

    align-items: center;

    gap: 3px;

    flex: 1;

    overflow-x: auto;
}


.nav::-webkit-scrollbar {

    display: none;
}


.nav a {

    padding:
        8px 11px;

    border-radius: 7px;

    color: #d9e1e8;

    font-size: 14px;

    white-space: nowrap;
}


.nav a:hover,
.nav a.active {

    background:
        var(--primary);

    color: white;
}


/* =====================================================
   ACTIONS
===================================================== */

.actions {

    display: flex;

    align-items: center;

    gap: 7px;
}


.visitor-time {

    display: flex;

    align-items: center;

    gap: 5px;

    padding:
        8px 9px;

    border-radius: 8px;

    background:
        rgba(255,255,255,.08);

    color: white;

    font-size: 13px;

    font-weight: bold;

    direction: ltr;

    white-space: nowrap;
}


.visitor-time span {

    min-width: 40px;

    text-align: center;
}


.icon-btn {

    width: 40px;

    height: 40px;

    border:
        1px solid #294056;

    border-radius: 8px;

    background: #102337;

    color: white;

    cursor: pointer;

    font-size: 17px;
}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    max-width: 1250px;

    margin: auto;

    padding:
        25px 18px 60px;
}


/* =====================================================
   PAGE HEADER
===================================================== */

.page-header {

    margin-bottom: 20px;
}


.page-title {

    font-size: 29px;

    font-weight: 900;
}


.page-description {

    color: var(--muted);

    font-size: 13px;

    margin-top: 3px;
}


/* =====================================================
   FILTERS
===================================================== */

.filters {

    display: flex;

    gap: 8px;

    margin-bottom: 25px;

    overflow-x: auto;
}


.filters::-webkit-scrollbar {

    display: none;
}


.filter-btn {

    border:
        1px solid var(--border);

    background: var(--card);

    color: var(--text);

    padding:
        9px 18px;

    border-radius: 8px;

    cursor: pointer;

    white-space: nowrap;

    font-size: 13px;
}


.filter-btn:hover,
.filter-btn.active {

    background:
        var(--primary);

    border-color:
        var(--primary);

    color: white;
}


/* =====================================================
   DAY TITLE
===================================================== */

.day-section {

    margin-bottom: 30px;
}


.day-title {

    display: flex;

    align-items: center;

    gap: 9px;

    font-size: 20px;

    font-weight: 900;

    margin-bottom: 13px;
}


.day-title::before {

    content: "";

    width: 5px;

    height: 23px;

    background:
        var(--primary);

    border-radius: 5px;
}


/* =====================================================
   COMPETITION
===================================================== */

.competition-block {

    margin-bottom: 15px;

    background: var(--card);

    border:
        1px solid var(--border);

    border-radius: 12px;

    overflow: hidden;

    box-shadow: var(--shadow);
}


.competition-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        11px 15px;

    background:
        rgba(0,168,107,.06);

    border-bottom:
        1px solid var(--border);
}


.competition-name {

    color:
        var(--primary);

    font-weight: bold;

    font-size: 14px;
}


.match-count {

    color: var(--muted);

    font-size: 11px;
}


/* =====================================================
   MATCH
===================================================== */

.match-row {

    display: grid;

    grid-template-columns:
        95px 1fr 90px 1fr 70px;

    align-items: center;

    min-height: 95px;

    padding:
        10px 15px;

    gap: 10px;

    border-bottom:
        1px solid var(--border);

    transition:
        background .2s;
}


.match-row:last-child {

    border-bottom: 0;
}


.match-row:hover {

    background:
        rgba(0,168,107,.04);
}


/* =====================================================
   TIME
===================================================== */

.match-time-box {

    text-align: center;
}


.match-time {

    font-size: 18px;

    font-weight: 900;
}


.match-date-small {

    color: var(--muted);

    font-size: 10px;
}


/* =====================================================
   TEAM
===================================================== */

.team {

    display: flex;

    align-items: center;

    gap: 9px;

    font-weight: bold;

    font-size: 14px;
}


.team.home {

    justify-content: flex-start;
}


.team.away {

    justify-content: flex-end;

    text-align: left;
}


.team-logo {

    width: 42px;

    height: 42px;

    object-fit: contain;

    flex-shrink: 0;
}


.team-placeholder {

    width: 42px;

    height: 42px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: var(--bg);

    border-radius: 50%;

    font-size: 19px;

    flex-shrink: 0;
}


/* =====================================================
   SCORE
===================================================== */

.score-box {

    text-align: center;
}


.score {

    font-size: 21px;

    font-weight: 900;
}


.vs {

    color: var(--muted);

    font-size: 12px;

    font-weight: bold;
}


/* =====================================================
   STATUS
===================================================== */

.status {

    justify-self: end;

    font-size: 10px;

    padding:
        4px 8px;

    border-radius: 20px;

    background:
        #dcfce7;

    color:
        #15803d;

    white-space: nowrap;
}


.status.live {

    background:
        #fee2e2;

    color:
        #dc2626;
}


.status.finished {

    background:
        #e5e7eb;

    color:
        #475569;
}


.status.postponed {

    background:
        #fef3c7;

    color:
        #b45309;
}


/* =====================================================
   EMPTY / LOADING
===================================================== */

.loading,
.empty {

    background: var(--card);

    border:
        1px solid var(--border);

    border-radius: 12px;

    padding: 40px 20px;

    text-align: center;

    color: var(--muted);
}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    background:
        #050c15;

    color:
        #aab5c1;

    padding:
        35px 18px;
}


.footer-inner {

    max-width: 1250px;

    margin: auto;

    text-align: center;
}


.footer-logo {

    color: white;

    font-size: 24px;

    font-weight: 900;
}


.footer-logo span {

    color:
        var(--primary);
}


.footer-text {

    margin-top: 7px;

    font-size: 12px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px) {

    .header-inner {

        flex-wrap: wrap;
    }


    .nav {

        order: 3;

        flex-basis: 100%;
    }


    .match-row {

        grid-template-columns:
            65px 1fr 55px 1fr 60px;

        gap: 5px;

        padding:
            9px;
    }


    .team {

        font-size: 12px;

        gap: 5px;
    }


    .team-logo,
    .team-placeholder {

        width: 35px;

        height: 35px;
    }

}


@media(max-width:550px) {

    .header-inner {

        padding:
            10px;
    }


    .logo {

        min-width: 120px;

        font-size: 22px;
    }


    .actions {

        margin-right: auto;
    }


    .visitor-time {

        font-size: 11px;

        padding:
            7px;
    }


    .container {

        padding:
            18px 10px 45px;
    }


    .page-title {

        font-size: 24px;
    }


    .match-row {

        grid-template-columns:
            55px 1fr 45px 1fr;

        position: relative;

        padding:
            13px 8px 35px;
    }


    .status {

        position: absolute;

        bottom: 8px;

        left: 50%;

        transform:
            translateX(-50%);
    }


    .match-time {

        font-size: 15px;
    }


    .score {

        font-size: 18px;
    }


    .team {

        font-size: 11px;

        flex-direction: column;

        gap: 3px;
    }


    .team.home {

        justify-content: center;
    }


    .team.away {

        justify-content: center;

        text-align: center;
    }


    .competition-header {

        padding:
            10px;
    }

}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://kjmvewppokrzcbegxmwg.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_As8JEhEsIfOta6cyi6e_AA_tp-T9k0W";


const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   DATA
===================================================== */

let matches = [];

let currentFilter = "today";


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(date) {

    if (!date)
        return "--:--";


    const d =
        new Date(date);


    if (
        Number.isNaN(
            d.getTime()
        )
    )
        return "--:--";


    return d.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit",
            hour12:false
        }
    );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date) {

    if (!date)
        return "";


    const d =
        new Date(date);


    if (
        Number.isNaN(
            d.getTime()
        )
    )
        return "";


    return d.toLocaleDateString(
        "ar-MA",
        {
            day:"numeric",
            month:"short"
        }
    );

}


/* =====================================================
   DATE KEY
===================================================== */

function dateKey(date) {

    const d =
        new Date(date);


    const year =
        d.getFullYear();


    const month =
        String(
            d.getMonth() + 1
        ).padStart(2,"0");


    const day =
        String(
            d.getDate()
        ).padStart(2,"0");


    return `${year}-${month}-${day}`;

}


/* =====================================================
   ADD DAYS
===================================================== */

function addDays(date, days) {

    const d =
        new Date(date);

    d.setDate(
        d.getDate() + days
    );

    return d;

}


/* =====================================================
   STATUS
===================================================== */

function statusInfo(status) {

    switch(status) {

        case "live":

            return {
                text:"🔴 مباشرة",
                className:"live"
            };


        case "finished":

            return {
                text:"✅ انتهت",
                className:"finished"
            };


        case "postponed":

            return {
                text:"⏸️ مؤجلة",
                className:"postponed"
            };


        default:

            return {
                text:"⏰ مبرمجة",
                className:"scheduled"
            };

    }

}


/* =====================================================
   FILTER MATCHES
===================================================== */

function filterMatches() {

    const today =
        new Date();


    const tomorrow =
        addDays(
            today,
            1
        );


    const todayKey =
        dateKey(today);


    const tomorrowKey =
        dateKey(tomorrow);


    if (
        currentFilter ===
        "today"
    ) {

        return matches.filter(
            function(match) {

                return (
                    dateKey(
                        match.match_date
                    ) === todayKey
                );

            }
        );

    }


    if (
        currentFilter ===
        "tomorrow"
    ) {

        return matches.filter(
            function(match) {

                return (
                    dateKey(
                        match.match_date
                    ) === tomorrowKey
                );

            }
        );

    }


    if (
        currentFilter ===
        "upcoming"
    ) {

        const now =
            new Date();


        return matches.filter(
            function(match) {

                return (
                    new Date(
                        match.match_date
                    ) >= now
                );

            }
        );

    }


    return matches;

}


/* =====================================================
   MATCH CARD
===================================================== */

function matchRow(match) {

    const status =
        statusInfo(
            match.status
        );


    const home =
        match.home_team ||
        "الفريق المضيف";


    const away =
        match.away_team ||
        "الفريق الضيف";


    const homeLogo =
        match.home_logo;


    const awayLogo =
        match.away_logo;


    return `

        <a
            class="match-row"
            href="match.html?id=${encodeURIComponent(match.id)}"
        >


            <div class="match-time-box">

                <div class="match-time">

                    ${formatTime(
                        match.match_date
                    )}

                </div>

                <div class="match-date-small">

                    ${formatDate(
                        match.match_date
                    )}

                </div>

            </div>


            <div class="team home">

                ${
                    homeLogo

                    ?

                    `<img
                        class="team-logo"
                        src="${escapeHtml(homeLogo)}"
                        alt="${escapeHtml(home)}"
                    >`

                    :

                    `<div class="team-placeholder">
                        ⚽
                    </div>`
                }

                <span>

                    ${escapeHtml(home)}

                </span>

            </div>


            <div class="score-box">

                ${
                    match.home_score !== null &&
                    match.home_score !== undefined

                    ?

                    `<div class="score">

                        ${escapeHtml(
                            match.home_score
                        )}

                        -

                        ${escapeHtml(
                            match.away_score
                        )}

                    </div>`

                    :

                    `<div class="vs">
                        VS
                    </div>`
                }

            </div>


            <div class="team away">

                <span>

                    ${escapeHtml(away)}

                </span>

                ${
                    awayLogo

                    ?

                    `<img
                        class="team-logo"
                        src="${escapeHtml(awayLogo)}"
                        alt="${escapeHtml(away)}"
                    >`

                    :

                    `<div class="team-placeholder">
                        ⚽
                    </div>`
                }

            </div>


            <div
                class="status ${status.className}"
            >

                ${status.text}

            </div>


        </a>

    `;

}


/* =====================================================
   RENDER
===================================================== */

function renderMatches() {

    const container =
        document.getElementById(
            "matchesContainer"
        );


    const filtered =
        filterMatches();


    if (!filtered.length) {

        container.innerHTML = `

            <div class="empty">

                لا توجد مباريات في هذا القسم حاليًا.

            </div>

        `;

        return;

    }


    /*
       تجميع المباريات حسب البطولة
    */

    const competitions = {};


    filtered.forEach(
        function(match) {

            const name =
                match.competition ||
                "مباريات أخرى";


            if (
                !competitions[name]
            ) {

                competitions[name] = [];

            }


            competitions[name].push(
                match
            );

        }
    );


    let html = "";


    Object.keys(
        competitions
    ).forEach(
        function(competition) {

            const list =
                competitions[
                    competition
                ];


            html += `

                <section
                    class="competition-block"
                >

                    <div
                        class="competition-header"
                    >

                        <div
                            class="competition-name"
                        >

                            🏆

                            ${escapeHtml(
                                competition
                            )}

                        </div>

                        <div
                            class="match-count"
                        >

                            ${list.length}
                            مباراة

                        </div>

                    </div>

                    ${list
                        .map(matchRow)
                        .join("")}

                </section>

            `;

        }
    );


    container.innerHTML =
        html;

}


/* =====================================================
   LOAD MATCHES
===================================================== */

async function loadMatches() {

    const container =
        document.getElementById(
            "matchesContainer"
        );


    try {

        const result =
            await client
            .from("matches")
            .select("*")
            .order(
                "match_date",
                {
                    ascending:true
                }
            )
            .limit(300);


        if (result.error) {

            console.error(
                "Supabase matches:",
                result.error
            );


            container.innerHTML = `

                <div class="empty">

                    ❌ تعذر تحميل المباريات.

                </div>

            `;

            return;

        }


        matches =
            result.data || [];


        renderMatches();

    }
    catch(error) {

        console.error(
            "Matches error:",
            error
        );


        container.innerHTML = `

            <div class="empty">

                ❌ حدث خطأ أثناء تحميل المباريات.

            </div>

        `;

    }

}


/* =====================================================
   FILTER BUTTONS
===================================================== */

document
.querySelectorAll(
    ".filter-btn"
)
.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                document
                .querySelectorAll(
                    ".filter-btn"
                )
                .forEach(
                    function(btn) {

                        btn.classList.remove(
                            "active"
                        );

                    }
                );


                this.classList.add(
                    "active"
                );


                currentFilter =
                    this.dataset.filter;


                renderMatches();

            }
        );

    }
);


/* =====================================================
   DARK MODE
===================================================== */

const darkBtn =
    document.getElementById(
        "darkBtn"
    );


function updateDarkButton() {

    darkBtn.textContent =
        document.body.classList.contains(
            "dark"
        )
        ? "☀️"
        : "🌙";

}


darkBtn.addEventListener(
    "click",
    function() {

        document.body.classList.toggle(
            "dark"
        );


        const isDark =
            document.body.classList.contains(
                "dark"
            );


        localStorage.setItem(
            "tactigol-dark",
            isDark
        );


        updateDarkButton();

    }
);


if (
    localStorage.getItem(
        "tactigol-dark"
    ) === "true"
) {

    document.body.classList.add(
        "dark"
    );

}


updateDarkButton();


/* =====================================================
   VISITOR TIME
===================================================== */

function updateVisitorTime() {

    const now =
        new Date();


    const time =
        now.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit",
                hour12:false
            }
        );


    const hour =
        now.getHours();


    const icon =
        hour >= 6 &&
        hour < 19

        ? "☀️"

        : "🌙";


    const element =
        document.getElementById(
            "visitorTime"
        );


    if (element) {

        element.innerHTML =
            `${icon} <span>${time}</span>`;

    }

}


updateVisitorTime();


setInterval(
    updateVisitorTime,
    1000
);


/* =====================================================
   START
===================================================== */

loadMatches();

</script>
